<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stan Projects — красив индекс на HTML проектите в GitHub repository." />
  <title>Stan Projects</title>

  <style>
    :root {
      --bg: #070b16;
      --bg-2: #0b1020;
      --surface: rgba(255, 255, 255, 0.075);
      --surface-strong: rgba(255, 255, 255, 0.12);
      --surface-hover: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
      --muted: #a8b3cf;
      --muted-2: #7683a3;
      --line: rgba(255, 255, 255, 0.14);
      --line-strong: rgba(255, 255, 255, 0.24);
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --accent-soft: rgba(124, 58, 237, 0.22);
      --cyan-soft: rgba(34, 211, 238, 0.16);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.36);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max-width: 1180px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 8%, rgba(124, 58, 237, 0.30), transparent 34%),
        radial-gradient(circle at 84% 12%, rgba(34, 211, 238, 0.20), transparent 32%),
        radial-gradient(circle at 50% 96%, rgba(124, 58, 237, 0.13), transparent 38%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 52%, #111827 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.76), transparent 78%);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .shell {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 52px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -130px;
      top: -150px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(34, 211, 238, .28), transparent 66%);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(30px, 5vw, 54px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 35px rgba(124, 58, 237, .38);
      font-weight: 950;
      letter-spacing: -0.035em;
    }

    .brand-eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .brand-repo {
      margin: 4px 0 0;
      color: var(--text);
      font-size: 17px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      white-space: nowrap;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .github-link:hover,
    .github-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,.13);
      border-color: var(--line-strong);
      outline: none;
    }

    .hero-title-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 980px;
      margin: 0 auto clamp(28px, 5vw, 46px);
      padding: 0 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 8.2vw, 96px);
      line-height: 1.04;
      letter-spacing: -0.035em;
      font-weight: 950;
      text-wrap: balance;
    }

    .gradient-text {
      display: inline-block;
      padding: 0 .04em .08em;
      background: linear-gradient(90deg, #ffffff, #c4b5fd 43%, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-copy {
      max-width: 700px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 1.8vw, 17px);
      line-height: 1.65;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.07);
    }

    .stat-value {
      display: block;
      font-size: clamp(23px, 3vw, 30px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .panel {
      margin-top: 22px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,.07);
      box-shadow: 0 18px 54px rgba(0,0,0,.22);
      backdrop-filter: blur(22px);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 190px auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .field { position: relative; }

    .field svg {
      position: absolute;
      left: 15px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .input,
    .select,
    .view-btn {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: rgba(7, 11, 22, .58);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease, transform .18s ease;
    }

    .input { padding: 0 16px 0 44px; }
    .select { padding: 0 14px; cursor: pointer; }

    .input:focus,
    .select:focus,
    .view-btn:focus-visible,
    .chip:focus-visible,
    .open-btn:focus-visible {
      border-color: rgba(34, 211, 238, .72);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, .13);
      outline: none;
    }

    .input::placeholder { color: rgba(168, 179, 207, .78); }

    .view-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(7, 11, 22, .45);
    }

    .view-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
    }

    .view-btn.active {
      color: var(--text);
      background: rgba(255,255,255,.12);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      color: var(--muted);
      font-weight: 700;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.055);
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
    }

    .chip:hover,
    .chip.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: rgba(196, 181, 253, .42);
      transform: translateY(-1px);
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .file-grid.list { grid-template-columns: 1fr; }

    .file-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: 190px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .file-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 16% 0%, rgba(34,211,238,.10), transparent 34%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .file-card:hover {
      transform: translateY(-3px);
      background: var(--surface-hover);
      border-color: var(--line-strong);
    }

    .file-card:hover::before { opacity: 1; }

    .file-grid.list .file-card {
      min-height: unset;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
    }

    .file-icon {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 18px;
      font-size: 22px;
      background: linear-gradient(135deg, rgba(124,58,237,.34), rgba(34,211,238,.18));
      border: 1px solid rgba(255,255,255,.12);
    }

    .file-main {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .file-name {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .file-desc {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.07);
      font-size: 12px;
      line-height: 1;
    }

    .open-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 14px;
      color: #06101f;
      background: linear-gradient(135deg, #ffffff, #a5f3fc);
      font-weight: 900;
      white-space: nowrap;
      transition: transform .18s ease, filter .18s ease;
    }

    .open-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .state-box {
      padding: 42px 18px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,.22);
      border-radius: var(--radius-lg);
      color: var(--muted);
      background: rgba(255,255,255,.035);
    }

    .state-box strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .skeleton-card {
      min-height: 190px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, rgba(255,255,255,.055), rgba(255,255,255,.105), rgba(255,255,255,.055));
      background-size: 220% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }

    .footer {
      margin-top: 26px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 960px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .view-toggle { grid-column: 1 / -1; width: 100%; }
      .file-grid, .skeleton-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 22px, var(--max-width));
        padding-top: 14px;
      }

      .hero, .panel {
        padding: 17px;
        border-radius: 23px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .brand { align-items: flex-start; }
      .brand-repo { white-space: normal; }
      .github-link { width: 100%; }

      h1 {
        font-size: clamp(42px, 14vw, 62px);
        letter-spacing: -0.03em;
      }

      .hero-title-wrap { margin-bottom: 26px; }
      .stats, .toolbar, .file-grid, .skeleton-grid, .file-grid.list .file-card { grid-template-columns: 1fr; }
      .file-grid.list .file-card { align-items: stretch; }
      .summary-row { align-items: flex-start; flex-direction: column; }
      .pill { width: 100%; justify-content: center; }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">SP</div>
          <div>
            <p class="brand-eyebrow">Project Home</p>
            <p class="brand-repo" id="repoName">Зареждане...</p>
          </div>
        </div>

        <a class="github-link" id="githubLink" href="#" target="_blank" rel="noreferrer">
          <span>GitHub Repository</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <div class="hero-title-wrap">
        <h1 id="pageTitle"><span class="gradient-text">Stan Projects</span></h1>
        
      </div>

      <div class="stats" aria-label="Project statistics">
        <div class="stat-card">
          <span class="stat-value" id="totalFiles">—</span>
          <span class="stat-label">HTML проекта</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="visibleFiles">—</span>
          <span class="stat-label">Показани</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="totalFolders">—</span>
          <span class="stat-label">Папки</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="lastUpdated">—</span>
          <span class="stat-label">Последен refresh</span>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="HTML files section">
      <div class="toolbar">
        <label class="field" aria-label="Търсене на файл">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m21 21-4.35-4.35" />
            <circle cx="11" cy="11" r="7" />
          </svg>
          <input class="input" id="searchInput" type="search" placeholder="Търси HTML файл или папка..." autocomplete="off" />
        </label>

        <select class="select" id="sortSelect" aria-label="Сортиране на файловете">
          <option value="name-asc">Име A → Z</option>
          <option value="name-desc">Име Z → A</option>
          <option value="path-asc">Папка A → Z</option>
          <option value="path-desc">Папка Z → A</option>
        </select>

        <div class="view-toggle" aria-label="Смяна на изглед">
          <button class="view-btn active" id="gridView" type="button" aria-pressed="true">Grid</button>
          <button class="view-btn" id="listView" type="button" aria-pressed="false">List</button>
        </div>
      </div>

      <div class="summary-row">
        <span>Показват се само <strong>HTML файлове</strong>, като <strong>index.html</strong> е изключен автоматично.</span>
        <span class="pill"><span aria-hidden="true">🌐</span> HTML only</span>
      </div>

      <div class="chips" id="quickFilters" aria-label="Бързи филтри по папка"></div>
      <div id="contentArea"></div>
    </section>

    <p class="footer">Built as a clean static project index. Optimized for Cloudflare Pages and GitHub repositories.</p>
  </main>

  <script>
    const REPO_OWNER = "stanimir559-bit";
    const REPO_NAME = "projects_1";
    const BRANCH = "main";

    const FILES = [];

    const state = {
      search: "",
      sort: "name-asc",
      view: "grid",
      folder: "all",
      loading: true,
      error: null
    };

    const repoUrl = `https://github.com/${REPO_OWNER}/${REPO_NAME}`;
    const githubApiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;

    const els = {
      repoName: document.getElementById("repoName"),
      githubLink: document.getElementById("githubLink"),
      totalFiles: document.getElementById("totalFiles"),
      visibleFiles: document.getElementById("visibleFiles"),
      totalFolders: document.getElementById("totalFolders"),
      lastUpdated: document.getElementById("lastUpdated"),
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      quickFilters: document.getElementById("quickFilters"),
      contentArea: document.getElementById("contentArea"),
      gridView: document.getElementById("gridView"),
      listView: document.getElementById("listView")
    };

    function getFolder(path) {
      return path.includes("/") ? path.split("/").slice(0, -1).join("/") : "root";
    }

    function getOpenUrl(file) {
      return new URL(file.path, window.location.href).href;
    }

    function formatFolder(folder) {
      return folder === "root" ? "Root" : folder;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setupMeta() {
      const folders = new Set(FILES.map(file => getFolder(file.path)));
      els.repoName.textContent = `${REPO_OWNER}/${REPO_NAME}`;
      els.githubLink.href = repoUrl;
      els.totalFiles.textContent = FILES.length;
      els.totalFolders.textContent = folders.size;
      els.lastUpdated.textContent = new Date().toLocaleDateString("bg-BG", { day: "2-digit", month: "short" });
    }

    function setupFilters() {
      const folders = [...new Set(FILES.map(file => getFolder(file.path)))].sort((a, b) => a.localeCompare(b));
      const topFolders = ["all", ...folders.slice(0, 8)];

      els.quickFilters.innerHTML = topFolders.map(folder => `
        <button class="chip ${folder === state.folder ? "active" : ""}" type="button" data-folder="${escapeHtml(folder)}">
          <span aria-hidden="true">${folder === "all" ? "⭐" : "📁"}</span>
          <span>${folder === "all" ? "Всички" : escapeHtml(formatFolder(folder))}</span>
        </button>
      `).join("");
    }

    function getFilteredFiles() {
      const query = state.search.trim().toLowerCase();

      const filtered = FILES.filter(file => {
        const folder = getFolder(file.path);
        const searchable = `${file.name} ${file.path} ${folder}`.toLowerCase();
        const matchesSearch = !query || searchable.includes(query);
        const matchesFolder = state.folder === "all" || folder === state.folder;
        return matchesSearch && matchesFolder;
      });

      filtered.sort((a, b) => {
        switch (state.sort) {
          case "name-desc": return b.name.localeCompare(a.name);
          case "path-asc": return a.path.localeCompare(b.path);
          case "path-desc": return b.path.localeCompare(a.path);
          case "name-asc":
          default: return a.name.localeCompare(b.name);
        }
      });

      return filtered;
    }

    function renderLoading() {
      els.contentArea.innerHTML = `
        <div class="skeleton-grid" aria-label="Зареждане на файловете">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      `;
    }

    function renderState(title, message) {
      els.contentArea.innerHTML = `
        <div class="state-box">
          <strong>${escapeHtml(title)}</strong>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
    }

    function renderFiles() {
      if (state.loading) {
        renderLoading();
        return;
      }

      if (state.error) {
        renderState("GitHub API Error", state.error);
        return;
      }

      const files = getFilteredFiles();
      els.visibleFiles.textContent = files.length;

      if (!files.length) {
        renderState("Няма намерени HTML файлове", "Пробвай с по-кратко търсене или избери друг folder filter.");
        return;
      }

      els.contentArea.innerHTML = `
        <div class="file-grid ${state.view === "list" ? "list" : ""}" id="fileGrid">
          ${files.map(file => {
            const folder = getFolder(file.path);
            const openUrl = getOpenUrl(file);

            return `
              <article class="file-card">
                <div class="file-icon" aria-hidden="true">🌐</div>
                <div class="file-main">
                  <h2 class="file-name">${escapeHtml(file.name)}</h2>
                  <p class="file-desc">${escapeHtml(file.path)}</p>
                  <div class="meta-row">
                    <span class="meta">HTML</span>
                    <span class="meta">${escapeHtml(formatFolder(folder))}</span>
                  </div>
                </div>
                <a class="open-btn" href="${escapeHtml(openUrl)}" target="_blank" rel="noreferrer">
                  Open <span aria-hidden="true">↗</span>
                </a>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function updateActiveFolder(folder) {
      document.querySelectorAll(".chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.folder === folder);
      });
    }

    function setView(view) {
      state.view = view;
      els.gridView.classList.toggle("active", view === "grid");
      els.listView.classList.toggle("active", view === "list");
      els.gridView.setAttribute("aria-pressed", view === "grid" ? "true" : "false");
      els.listView.setAttribute("aria-pressed", view === "list" ? "true" : "false");
      renderFiles();
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", event => {
        state.search = event.target.value;
        renderFiles();
      });

      els.sortSelect.addEventListener("change", event => {
        state.sort = event.target.value;
        renderFiles();
      });

      els.quickFilters.addEventListener("click", event => {
        const chip = event.target.closest(".chip");
        if (!chip) return;
        state.folder = chip.dataset.folder;
        updateActiveFolder(state.folder);
        renderFiles();
      });

      els.gridView.addEventListener("click", () => setView("grid"));
      els.listView.addEventListener("click", () => setView("list"));
    }

    async function loadGitHubFiles() {
      setupMeta();
      bindEvents();
      renderFiles();

      try {
        const response = await fetch(githubApiUrl, { headers: { "Accept": "application/vnd.github+json" } });

        if (!response.ok) {
          throw new Error(`Could not load repository tree. GitHub returned ${response.status}.`);
        }

        const data = await response.json();

        if (!Array.isArray(data.tree)) {
          throw new Error("Repository tree was not available. Check repository visibility and branch name.");
        }

        FILES.length = 0;

        data.tree
          .filter(item => {
            const lower = item.path.toLowerCase();
            return item.type === "blob" && lower.endsWith(".html") && !lower.endsWith("index.html");
          })
          .forEach(item => {
            FILES.push({
              name: item.path.split("/").pop(),
              path: item.path
            });
          });

        state.loading = false;
        state.error = null;
        setupMeta();
        setupFilters();
        renderFiles();
      } catch (error) {
        console.error(error);
        state.loading = false;
        state.error = `${error.message} Ако repository-то е private или branch-ът не е main, обнови настройките в началото на script-а.`;
        setupMeta();
        renderFiles();
      }
    }

    loadGitHubFiles();
  </script>
</body>
</html>
