function zipFiles(files){

/* A small localStorage copy plus IndexedDB for larger seasons and history. */
(function(){let dbPromise;function open(){if(!('indexedDB'in globalThis))return Promise.reject(Error('NO_INDEXED_DB'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('strongman-arena-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('sessions');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('STORAGE_BLOCKED'));});return dbPromise;}
 const api={async load(){const db=await open();return new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readonly'),req=tx.objectStore('sessions').get('active');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});},async save(payload,stamp){const db=await open();return new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readwrite'),table=tx.objectStore('sessions'),req=table.get('active');req.onsuccess=()=>{if(!req.result||req.result.stamp<=stamp)table.put({stamp,payload},'active');};tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('STORAGE_ABORT'));});}};
 globalThis.SMStorage=api;
})();

let seasonFormBase=null,roundFormBase=null,roundCompetitionBase=null;
const L=(bg,en)=>lang==='bg'?bg:en;
function visitorURL(){const base=sync?.url||location.origin+'/strongman';return base.replace(/\/$/,'')+'/visitors';}
function seasonRules(s){return L('Всички кръгове се броят. Скала по крайно място: ','All rounds count. Points by final place: ')+s.scale.join(' / ')+L('. След скалата: 0 т. Равните места делят средно точките на заетите позиции. DNS/DQ: 0 т.; останалите места не се пренареждат. Равен сезонен сбор: ','. Beyond the scale: 0 points. Ties average the occupied positions. DNS/DQ: 0; other places are not shifted. Equal season totals: ')+(s.tie==='countback'?L('повече първи, после втори места и т.н.; след това споделено място.','most first places, then seconds, etc.; then shared place.'):L('споделено място.','shared place.'));}

function audienceCard(){return `<section class="card noprint"><h2>${L('Зрителски изглед','Visitor view')}</h2><p class="caption">${L('Публичен линк само за преглед: класиране, профили на състезателите и сезон. Без код за достъп и без редактиране. Съдийски бележки и история не се публикуват.','Public read-only link: standings, athlete profiles and season. No access code or editing. Judge notes and audit history stay private.')}</p><p><span class="badge ${d().audience?.enabled?'green':'orange'}">${d().audience?.enabled?L('Публикуването е включено','Publishing enabled'):L('Публикуването е изключено','Publishing disabled')}</span></p>${sync?`<div class="row">${button('audience',d().audience?.enabled?L('Изключи публичния изглед','Disable public view'):L('Активирай публичния изглед','Enable public view'),'primary')}${d().audience?.enabled?`<a class="actionlink" target="_blank" rel="noopener" href="${esc(visitorURL())}">${L('Отвори зрителския изглед','Open visitor view')} ↗</a>${button('copyVisitor',L('Копирай линка','Copy link'))}`:''}</div><p class="caption shareurl">${esc(visitorURL())}</p>${queue.length?`<p class="notice">${L('Промените ще са публични след успешна синхронизация.','Changes become public after successful sync.')}</p>`:''}`:`<p class="notice">${L('Свържете съдийското устройство с общата сесия, за да публикувате резултатите на живо.','Connect the judge device to the shared session to publish live results.')}</p>${button('nav',t('connect'),'dark','data-view="connect"')}`}</section>`;}
function seasonView(){const s=d().season;seasonFormBase=SM.clone(s||null);return hero('SEASON & LIVE',L('Сезон и публика','Season & visitors'),L('Един сезон. Всички кръгове. Проследим път до годишния победител.','One season. Every round. A clear path to the annual winner.'))+audienceCard()+(s?`<section class="card"><div class="row between"><div><span class="badge ${s.closed?'green':'orange'}">${s.closed?L('Финален сезон','Final season'):L('Текущ сезон','Season in progress')}</span><h2 style="margin-top:12px">${esc(s.title)} · ${s.year}</h2></div><div class="row noprint">${button('seasonCsv','CSV')}${button('seasonWord','Word')}${button('seasonPrint',t('print'))}</div></div><p class="caption">${esc(seasonRules(s))}</p>${s.competitions.length?seasonTable(s):`<div class="empty">${L('Все още няма добавен завършен кръг.','No finished round has been added yet.')}</div>`}${s.closed&&s.competitions.length?`<div class="notice good">${L('Годишен победител','Annual winner')}: <strong>${esc(SM.seasonScores(s).filter(r=>r.rank===1).map(r=>r.athlete.name).join(' / '))}</strong></div>`:''}</section><div class="layout"><div><section class="card noprint"><h2>${L('Текущо състезание → сезон','Current competition → season')}</h2><p class="caption">${L('Завършете всички дисциплини и натиснете „Приключи състезанието“. След това свържете всеки участник с постоянния му сезонен профил. При корекция на стар кръг го добавете отново със същия идентификатор — ще се обнови, без да се дублира.','Complete all events and finish the competition. Then match every entrant to their permanent season profile. After correcting an archived round, save it again using the same identifier: it updates without duplication.')}</p>${s.competitions.some(c=>c.id===d().id)?`<p class="notice ${JSON.stringify(s.competitions.find(c=>c.id===d().id).data)===JSON.stringify(SM.competitionSnapshot(d()))?'good':''}">${JSON.stringify(s.competitions.find(c=>c.id===d().id).data)===JSON.stringify(SM.competitionSnapshot(d()))?L('Текущият кръг е записан в сезона.','Current round saved in the season.'):L('Текущият кръг има промени. Обновете сезонния архив.','Current round has changed. Update the season archive.')}</p>`:''}${button('roundSave',s.competitions.some(c=>c.id===d().id)?L('Обнови този кръг в сезона','Update this round in season'):L('Добави завършения кръг','Add finished round'),'primary',s.closed||d().phase!=='finished'||!allComplete()?'disabled':'')} ${button('newRound',L('Следващо състезание','Next competition'),'',s.closed?'disabled':'')}</section><section class="card"><h2>${L('Архив на кръговете','Round archive')} · ${s.competitions.length}/40</h2>${s.competitions.map((c,i)=>`<details><summary>${i+1}. ${esc(c.data.title)} · ${esc(c.data.date)}</summary><p class="caption">${esc(c.data.venue)} · ${c.data.athletes.length} ${t('athletes')}</p><div class="tablewrap">${seasonRoundTable(c)}</div><div class="row noprint">${button('loadRound',L('Отвори за преглед / корекция','Open for review / correction'),'small',`data-id="${esc(c.id)}"`)}${!s.closed?button('removeRound',L('Изключи от сезона','Exclude from season'),'small danger',`data-id="${esc(c.id)}"`):''}</div></details>`).join('')}</section></div><aside><section class="card noprint"><h2>${L('Правила на сезона','Season rules')}</h2>${seasonForm(s)}<p class="caption">${L('Скалата и тайбрекът се фиксират след първия добавен кръг. Промените и изключените кръгове могат да се възстановят от История. Архивът JSON съдържа целия сезон.','The scale and tiebreak lock after the first round. Changes and excluded rounds can be restored in History. JSON backup includes the entire season.')}</p><div class="row">${button('seasonClose',s.closed?L('Отвори сезона за корекции','Reopen season for corrections'):L('Обяви финал на сезона','Finalize season'),'',!s.competitions.length?'disabled':'')}${button('backup',t('backup'))}</div></section><section class="card noprint"><h2>${L('Постоянни профили','Permanent profiles')}</h2><p class="caption">${L('Един и същ човек трябва да има един профил през целия сезон. Името може да се коригира, идентификаторът остава същият.','Use one profile per person throughout the season. Names can be corrected; identifiers stay the same.')}</p>${s.athletes.map(a=>`<div class="row between eventcard"><span>${esc(a.name)} <small class="caption">${esc(a.id.slice(0,8))}</small></span>${button('renameSeasonAthlete',L('Име','Name'),'small',`data-id="${esc(a.id)}"`)}</div>`).join('')}</section><section class="card dangerzone noprint">${button('seasonNew',L('Нов сезон','New season'),'danger')}</section></aside></div>`:`<section class="card"><h2>${L('Създай сезон','Create a season')}</h2><p class="caption">${L('Предложена организаторска скала, а не универсален федеративен правилник. Променете я преди първия кръг. Всички кръгове имат еднаква тежест.','Suggested organizer scale, not a universal federation rule. Adjust it before the first round. All rounds have equal weight.')}</p>${seasonForm(SM.seasonFresh())}</section>`);}
function seasonForm(s){return `<form id="seasonForm">${field('seasonTitle',L('Име на сезона','Season name'),s.title,'text','required maxlength="150"')}${field('seasonYear',L('Година','Year'),s.year,'number','required min="2000" max="2200"')}<fieldset ${s.competitions.length?'disabled':''} style="border:0;padding:0;margin:0">${field('seasonScale',L('Точки от първо място надолу — разделени с интервал','Points from first place down — separated by spaces'),s.scale.join(' '),'text','required')}${select('seasonTie',L('Равен годишен сбор','Equal annual totals'),[['countback',t('countback')],['shared',L('Споделено място','Shared place')]],s.tie)}</fieldset><button type="submit" class="dark">${t('save')}</button></form>`;}
function seasonRoundTable(c){return `<table><thead><tr><th>${t('place')}</th><th>${t('name')}</th><th>${t('total')}</th></tr></thead><tbody>${SM.standings(c.data).map(r=>`<tr><td>${r.tied?'=':''}${r.rank}</td><td class="name">${esc(r.athlete.name)}</td><td>${fmt(r.total)}</td></tr>`).join('')}</tbody></table>`;}
function openRoundMapping(){if(!d().season||d().season.closed||d().phase!=='finished'||!allComplete())return;roundFormBase=SM.clone(d().season);roundCompetitionBase=SM.competitionSnapshot(d());const s=roundFormBase,old=s.competitions.find(c=>c.id===d().id);$('#dialog').innerHTML=`<div class="inner"><div class="dialoghead"><h2>${L('Свържи сезонните профили','Match season profiles')}</h2>${button('close','×','icon',`aria-label="${t('close')}"`)}</div><p class="notice">${L('Проверете всяко съвпадение. При съименници изберете различни профили. Никой не се слива автоматично.','Review every match. Namesakes need separate profiles. Nobody is merged automatically.')}</p><form id="roundForm">${d().athletes.map((a,i)=>{const entry=old?.entries.find(e=>e.athleteId===a.id);const matched=entry?.seasonId||s.athletes.find(x=>x.name.trim().toLocaleLowerCase()===a.name.trim().toLocaleLowerCase())?.id||'new';const started=d().events.some(e=>['ok','dnf','zero'].includes(d().results[e.id]?.[a.id]?.status));return `<div class="card"><h3>${a.bib}. ${esc(a.name)}</h3>${select('match'+i,L('Сезонен профил','Season profile'),[['new',L('+ Нов профил','+ New profile')],...s.athletes.map(x=>[x.id,x.name+' · '+x.id.slice(0,8)])],matched)}${select('entryStatus'+i,L('Сезонни точки','Season points'),[['ranked',L('По крайното класиране','By final placing')],['dns',L('Без участие — 0 точки','No start — 0 points')],['dq',L('Дисквалифициран — 0 точки','Disqualified — 0 points')]],entry?.status||(started?'ranked':'dns'))}</div>`;}).join('')}<label class="check"><input type="checkbox" required>${L('Проверих профилите и окончателното класиране.','I checked the profiles and final results.')}</label><button type="submit" class="primary" style="margin-top:15px">${L('Запази кръга в сезона','Save round in season')}</button></form></div>`;$('#dialog').showModal();}
async function nextCompetition(){const baseline=SM.clone(d());if(queue.length){toast(t('onlineleave'));return;}if(d().athletes.length&&!d().season?.competitions.some(c=>c.id===d().id&&JSON.stringify(c.data)===JSON.stringify(SM.competitionSnapshot(d())))&&!await seasonConfirm(L('Текущото състезание още не е добавено в сезона или има незаписани корекции. Да продължа ли? JSON копие ще бъде изтеглено.','Current competition is not saved in the season or has unsaved corrections. Continue? A JSON backup will be downloaded.')))return;if(!await seasonConfirm(L('Да започна следващо състезание? Сезонът и архивираните кръгове се запазват.','Start the next competition? The season and archived rounds are retained.')))return;if(JSON.stringify(d())!==JSON.stringify(baseline))throw Error('CONFLICT');backup();const next=SM.fresh();if(d().season)next.season=SM.clone(d().season);if(d().audience)next.audience=SM.clone(d().audience);changeData(next,'Next competition (season retained)');drafts={};view='setup';standingsThrough=-1;athleteId='';eventIndex=0;persist();render();}
function seasonExportRows(s){return [[t('place'),t('name'),...s.competitions.map(c=>c.data.title),t('total')],...SM.seasonScores(s).map(r=>[(r.tied?'=':'')+r.rank,r.athlete.name,...r.rounds.map(x=>x?.points??''),r.total])];}
async function seasonAction(act,id){
 if(act==='audience'){commit([{path:['data','audience'],next:{enabled:!d().audience?.enabled}}],'Public viewer '+(!d().audience?.enabled?'enabled':'disabled'));return true;}
 if(act==='copyVisitor'){try{await navigator.clipboard.writeText(visitorURL());toast(L('Линкът е копиран','Link copied'));}catch{prompt(L('Копирайте линка','Copy this link'),visitorURL());}return true;}
 if(act==='roundSave'){openRoundMapping();return true;}
 if(act==='newRound'){await nextCompetition();return true;}
 if(act==='seasonNew'){if(!await seasonConfirm(L('Започване на нов сезон? Изтегля се JSON архив на текущите данни; старият сезон може да се възстанови и от История.','Start a new season? A JSON backup is downloaded; the old season can also be restored through History.')))return true;backup();const s=SM.seasonFresh();s.title=L('Сезон ','Season ')+s.year;commit([{path:['data','season'],next:s}],'New season');return true;}
 const s=d().season;if(!s)return false;
 if(act==='seasonClose'){if(!s.closed&&!SM.seasonScores(s).some(r=>r.total>0)){toast(L('Няма присъдени сезонни точки. Проверете участията, преди да обявите победител.','No season points have been awarded. Review entries before declaring a winner.'));return true;}if(!await seasonConfirm(s.closed?L('Да отворя сезона за корекции?','Reopen the season for corrections?'):L('Всички кръгове ли са добавени? Да обявя годишния победител?','Have all rounds been added? Finalize the annual winner?')))return true;commit([{path:['data','season','closed'],prev:s.closed,next:!s.closed}],'Season '+(s.closed?'reopened':'finalized'));return true;}
 if(act==='renameSeasonAthlete'){const name=await seasonConfirm(L('Ново име на сезонния профил','New season profile name'),s.athletes.find(a=>a.id===id)?.name);if(typeof name!=='string'||!name.trim()||name.length>150)return true;const athletes=SM.clone(s.athletes);athletes.find(a=>a.id===id).name=name.trim();commit([{path:['data','season','athletes'],prev:s.athletes,next:athletes}],'Rename season profile');return true;}
 if(act==='removeRound'){if(s.closed)return true;if(await seasonConfirm(L('Да изключа кръга от сезонния сбор? Може да се върне от История.','Exclude the round from season totals? Restore it through History.')))commit([{path:['data','season','competitions'],prev:s.competitions,next:s.competitions.filter(c=>c.id!==id)}],'Exclude round');return true;}
 if(act==='loadRound'){if(queue.length){toast(t('onlineleave'));return true;}if(!await seasonConfirm(L('Това ще смени текущото състезание за всички съдии. Да отворя архивирания кръг?','This changes the current competition for all judges. Open the archived round?')))return true;backup();const next=SM.clone(s.competitions.find(c=>c.id===id).data);next.season=SM.clone(s);if(d().audience)next.audience=SM.clone(d().audience);changeData(next,'Open archived round');drafts={};view='standings';standingsThrough=-1;persist();render();return true;}
 if(act==='seasonCsv'){download('strongman-season.csv',new Blob(['\ufeff'+seasonExportRows(s).map(row=>row.map(v=>'"'+SM.csvCell(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));return true;}
 if(act==='seasonWord'){download('strongman-season.docx',makeSeasonWord(s));return true;}
 if(act==='seasonPrint'){window.print();return true;}
 return false;
}
function restoreSeasonDraft(){if(view!=='season'||!drafts.seasonForm)return;const saved=drafts.seasonForm;if(JSON.stringify(saved.base)!==JSON.stringify(d().season||null))return;for(const [key,value]of Object.entries(saved.values)){const el=document.getElementById(key);if(el&&!el.disabled)el.value=value;}}
document.addEventListener('input',ev=>{if(ev.target.closest('#seasonForm')){drafts.seasonForm={base:seasonFormBase,values:Object.fromEntries(new FormData($('#seasonForm')))};persist();}});
document.addEventListener('change',ev=>{if(ev.target.closest('#seasonForm')){drafts.seasonForm={base:seasonFormBase,values:Object.fromEntries(new FormData($('#seasonForm')))};persist();}});
document.addEventListener('submit',ev=>{
 if(ev.target.id==='seasonForm'){ev.preventDefault();const fd=new FormData(ev.target);try{const s=SM.clone(seasonFormBase||SM.seasonFresh());s.title=String(fd.get('seasonTitle')).trim();s.year=Number(fd.get('seasonYear'));if(!s.competitions.length){s.scale=String(fd.get('seasonScale')).trim().split(/\s+/).map(SM.number);s.tie=fd.get('seasonTie');}SM.validateSeason(s);delete drafts.seasonForm;commit([{path:['data','season'],prev:seasonFormBase,next:s}],'Season settings');toast(t('saved'));}catch(err){toast(err.message==='CONFLICT'?t('stale'):L('Проверете името, годината и низходящата скала.','Check the name, year and descending point scale.'));}}
 if(ev.target.id==='roundForm'){ev.preventDefault();if(!ev.target.reportValidity())return;try{if(JSON.stringify(SM.competitionSnapshot(d()))!==JSON.stringify(roundCompetitionBase))throw Error('CONFLICT');const fd=new FormData(ev.target),s=SM.clone(roundFormBase),used=new Set();const entries=d().athletes.map((a,i)=>{let sid=fd.get('match'+i);if(sid==='new'){sid=SM.uid();s.athletes.push({id:sid,name:a.name});}if(used.has(sid))throw Error('DUPLICATE');used.add(sid);return {athleteId:a.id,seasonId:sid,status:fd.get('entryStatus'+i)};});const c={id:d().id,data:SM.competitionSnapshot(d()),entries};const i=s.competitions.findIndex(c=>c.id===d().id);if(i<0)s.competitions.push(c);else s.competitions[i]=c;SM.validateSeason(s);commit([{path:['data','season'],prev:roundFormBase,next:s}],'Save season round: '+d().title);$('#dialog').close();toast(t('saved'));}catch(err){toast(err.message==='DUPLICATE'?L('Двама участници не могат да са един сезонен профил.','Two entrants cannot share one season profile.'):err.message==='CONFLICT'?t('stale'):t('error'));}}
});


function seasonConfirm(message,value){return new Promise(resolve=>{const dialog=$('#dialog');dialog.innerHTML='<div class="inner"><h2>'+L('Потвърждение','Confirmation')+'</h2><p>'+esc(message)+'</p>'+(value===undefined?'':field('seasonAnswer',L('Име','Name'),value,'text','maxlength="150"'))+'<div class="row"><button type="button" class="primary" data-season-choice="yes">'+L('Потвърди','Confirm')+'</button><button type="button" data-season-choice="no">'+L('Отказ','Cancel')+'</button></div></div>';const done=answer=>{dialog.removeEventListener('click',click);dialog.removeEventListener('cancel',cancel);dialog.close();resolve(answer);};const click=ev=>{const b=ev.target.closest('[data-season-choice]');if(b)done(b.dataset.seasonChoice==='yes'?(value===undefined?true:$('#seasonAnswer').value):false);};const cancel=ev=>{ev.preventDefault();done(false);};dialog.addEventListener('click',click);dialog.addEventListener('cancel',cancel);dialog.showModal();});}

/* Frequent actions stay near the work; secondary tools live under More. */
let missingOnly=true;
function render(){
 if(['eventReview','eventStandings'].includes(view)&&(d().phase==='setup'||!d().events.length))view='overview';
 document.body.dataset.screen=view;document.documentElement.lang=lang;document.title='Strongman Arena';$('#savebadge').innerHTML=badge();$('#language').textContent=lang==='bg'?'EN':'БГ';
 const activeView=['eventReview','eventStandings'].includes(view)?'scoring':view;const items=[['overview',L('Начало','Overview')],['scoring',L('Точкуване','Score')],['standings',t('standings')]];
 $('#nav').innerHTML=items.map(([v,label])=>button(v==='scoring'?'resumeQueue':'nav',navIcon(v)+'<span>'+label+'</span>',activeView===v?'active':'',`data-view="${v}" ${activeView===v?'aria-current="page"':''}`)).join('')+button('more',navIcon('more')+'<span>'+L('Още','More')+'</span>',!items.some(([v])=>v===activeView)?'active':'','aria-haspopup="dialog"');
 if(standingsThrough>d().events.length)standingsThrough=-1;if(eventIndex>=d().events.length)eventIndex=Math.max(0,d().events.length-1);
 $('#main').innerHTML=({overview:overviewView,setup:setupView,scoring:scoringView,eventReview:eventReviewView,eventStandings:()=>standingsView(true),standings:standingsView,season:seasonView,history:historyView,guide:guideView,connect:connectView}[view]||overviewView)();
 if(view==='setup')setupFormBase=SM.clone(d());syncNotice();storageNotice();$('#footer').innerHTML='<span>STRONGMAN ARENA · FIELD EDITION · v2.1.1</span><span>'+t('precision')+'</span>';
 if(view==='scoring')restoreDraft();applySetupDraft();restoreSeasonDraft();
}
function setupView(){let html=baseSetupView();html=html.replace('Редът определя стартовите номера. Имената трябва да са различни.','Броят се изчислява автоматично от имената. Редът определя стартовите номера. Имената трябва да са различни.').replace('The order sets bib numbers. Names must be unique.','The athlete count follows the names automatically. The order sets bib numbers. Names must be unique.');
 if(d().phase==='setup'&&d().season?.athletes.length)html=html.replace('<textarea id="names"',button('seasonRoster',L('Избери от сезонния списък','Choose season athletes'),'small')+'<textarea id="names"');
 return html;

function connectView(){return hero('CONNECTED FIELD',L('Общи резултати, ясна връзка.','Shared results. Clear connection.'),L('Самостоятелното точкуване работи без код. За няколко съдии свържете общата сесия.','Individual scoring needs no code. Connect a shared session for multiple judges.'))+`<div class="layout"><div class="card"><h2>${t('connect')}</h2><form id="syncForm">${field('actor',t('actor'),sync?.actor||localStorage.getItem('sm-actor')||'','text','required maxlength="100" autocomplete="name"')}${field('key',t('key'),sync?.key||'','password','required autocomplete="off"')}<p class="caption">${L('Кодът се определя от организатора в Cloudflare като SM_KEY. Въвежда се веднъж на съдийско устройство. Не се споделя със зрителите.','The organizer sets this code as SM_KEY in Cloudflare. Enter it once per judge device. Do not share it with visitors.')}</p><details><summary>${L('Адрес на сървъра / разширени настройки','Server address / advanced')}</summary>${field('server',t('server'),sync?.url||(location.protocol.startsWith('http')?location.origin+'/strongman':''),'url','required')}</details></form><div class="row">${button('smartConnect',sync?L('Провери връзката','Check connection'):L('Свържи и синхронизирай','Connect and sync'),'primary')}${sync?button('disconnect',t('disconnect'),'danger'):''}</div><div id="connectionMessage" role="status"></div>${sync?`<div class="notice ${net==='online'&&!queue.length?'good':''}" style="margin-top:18px">${badge()} · ${L('Чакащи записи','Pending changes')}: ${queue.length}</div>`:''}${net==='conflict'?`<div class="notice error">${t('conflictText')}</div>${button('discard',t('discard'),'danger')}`:''}<div class="row" style="margin-top:18px">${button('retry',t('retry'))}${button('backup',t('backup'))}${button('restore',t('restore'))}</div><details><summary>${L('Нова сесия / присъединяване поотделно','Separate create / join actions')}</summary><div class="row">${button('join',t('join'))}${button('publish',t('publish'))}</div></detai function resumeQueue(index){captureDraft();if(d().phase==='setup'){view='setup';}else{const draftCurrent=hasUnfinishedDraft()?drafts[draftKey()]:null;if(Number.isInteger(index))eventIndex=index;else if(!draftCurrent){const i=d().events.findIndex(e=>!complete(e));if(i>=0)eventIndex=i;}const e=d().events[eventIndex];if(!draftCurrent||Number.isInteger(index))athleteId=d().athletes.find(a=>!d().results[e.id]?.[a.id])?.id||d().athletes[0]?.id;if(complete(e)&&!hasUnfinishedDraft()){openEventReview(eventIndex,false);return;}view='scoring';}persist();render();window.scrollTo(0,0);if(view==='scoring')$('#resultFields input')?.focus();}

function modeRule(e){const bg={race:'Завършилите са пред всички незавършили и се подреждат по по-кратко време. Незавършилите — по повече изминати метри. Равно разстояние е равен резултат, освен ако предварително е избрано време до измервателната точка.',reps:'Броят се само повторенията, признати от съдията. При равен брой точките се делят, освен ако предварително е включено време до последното зачетено повторение.',max:'Сравнява се най-тежкият успешен опит. Еднаквите тежести са равни; телесно тегло и брой опити не се използват автоматично. Запишете опитите в бележката.',hold:'По-дългото валидно задържане печели. Времето се спира при съдийския критерий за загуба на позиция или хват.',distance:'По-голямата валидна дистанция печели. При Конаново колело използвайте общо изминати метри, а не смесени обиколки и градуси.',series:'Повече завършени снаряди или стъпки печелят. При включено време се сравнява времето до последния зачетен успех; при „само пълна серия“ частичните равни бройки делят точки.',medley:'Първо повече завършени етапи, после повече метри в следващия етап, после времето според избраната настройка. Не събирайте несъпоставими метри от различни етапи. Необходима е ясна последователност.',height:'По-голяма успешно преодоляна височина печели. Само ако е включено: по-малко неуспехи на най-добрата височина, после по-малко общо. Иначе равното постижение дели точки.',tiers:'Повече повторения с най-тежкия уред печелят, после със средния, после с най-лекия. Едно тежко повторение побеждава произволен брой по-леки. Тежестите и редът трябва да са еднакви за всички.',manual:t('manualhint')},en={race:'Finishers rank ahead of every non-finisher and are ordered by faster time. Non-finishers rank by greater distance. Equal distance ties unless time to a measured checkpoint was agreed in advance.',reps:'Count only referee-approved repetitions. Equal counts share points unless time to the last valid rep was enabled before the start.',max:'Rank the heaviest successful attempt. function performance(e,r){if(!r)return '—';if(['zero','dns','wd','dq'].includes(r.status))return t(r.status==='zero'?'zeroStatus':r.status);let s='';switch(e.mode){case'race':s=r.status==='dnf'?`${fmt(r.distance)} m · DNF`:`${fmt(r.time)} s`;break;case'reps':s=`${r.reps} ${lang==='bg'?'повт.':'reps'}`;break;case'max':s=`${fmt(r.weight)} kg`;break;case'hold':s=`${fmt(r.time)} s`;break;case'distance':s=`${fmt(r.distance)} m`;break;case'series':case'medley':s=`${r.count}/${e.target}`+(e.mode==='medley'&&r.partial?` + ${fmt(r.partial)} m`:'');break;case'height':s=`${fmt(r.height)} m`+(e.secondary==='all'?` (${r.misses}/${r.totalMisses})`:'');break;case'tiers':s=`${r.heavy} / ${r.medium} / ${r.light}`;break;case'manual':s=`#${r.placing}`;}
 if(['reps','series','medley'].includes(e.mode)&&r.time&&e.secondary!=='none')s+=` · ${fmt(r.time)} s`;if(r.penalty)s+=` +${fmt(r.penalty)} s`;if(r.deduction)s+=` −${fmt(r.deduction)} ${t('points').toLowerCase()}`;return s;}

 try{SM.validateResult(e,r);}catch(err){resultError(err);return false;}

function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}

async function request(url,key,path,options={}){const res=await fetch(url+path,{...options,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json',...(options.headers||{})},signal:AbortSignal.timeout(8000)});if(res.status===304)return null;const body=await res.json();if(!res.ok)throw Object.assign(Error(body.error||'NETWORK'),{status:res.status});return body;}
async function connect(create){if(busy||sync&&queue.length){toast(t('onlineleave'));return;}const f=$('#syncForm');if(!f.reportValidity())return;const fd=new FormData(f),url=String(fd.get('server')).replace(/\/$/,''),key=String(fd.get('key')),name=String(fd.get('actor')).trim();try{let remote=await request(url,key,'/api/state');if(create){if(remote.doc){toast(t('serverexists'));return;}remote=await request(url,key,'/api/init',{method:'POST',body:JSON.stringify({doc})});}else{if(!remote.doc){toast(t('serverempty'));return;}if(!await seasonConfirm(t('confirmjoin')))return;backup();}SM.validateDocument(remote.doc);doc=remote.doc;sync={url,key,actor:name};localStorage.setItem('sm-actor',name);queue=[];net='online';lastServer=SM.clone(doc);persist();render();toast(t('synced'));}catch{toast(t('syncerror'));}}
function syncNotice(){refreshFieldStatus();const box=$('#syncAlert');if(!box)return;box.innerHTML=net==='conflict'?'<div class="notice error">'+L('Общата синхронизация е спряна. Локалните промени са запазени.','Shared sync is paused. Local changes are retained.')+' '+esc(lastSyncError)+' '+button('nav',t('connect'),'small','data-view="connect"')+' '+button('backup',t('backup'))+'</div>':'';}
async function pump(){if(!sync||busy||net==='conflict'||readOnlyTab||!storageReady||damagedStorage)return;busy=true;const conf=sync;try{while(queue.length){const op=queue[0],remote=await request(conf.url,conf.key,'/api/op',{method:'POST',body:JSON.stringify(op)});if(sync!==conf)return;queue.shift();lastServer=remote.doc;let merged=remote.doc;try{for(const waiting of queue)merged=SM.apply(merged,waiting);}catch{persist();throw Error('CONFLICT');}doc=merged;persist();}const remote=await request(conf.url,conf.key,'/api/state',{headers:doc.revision===lastServer?.revision?{'If-None-Match':'"'+doc.revision+'"'}:{}});if(sync!==conf)return;if(remote?.doc&&JSON.stringify(remote.doc)!==JSON.stringify(doc)){SM.validateDocument(remote.doc);if(remote.doc.data.id!==doc.data.id&&queue.length)throw Error('CONFLICT');lastServer=remote.doc;let rebased=remote.doc;for(const waiting of queue)rebased=SM.apply(rebased,waiting);doc=rebased;persist();if(!$('#dialog').open&&!document.activeElement?.matches('input,textarea,select'))render();else refreshLiveTables();}net='online';lastSyncError='';}catch(err){net=err.message==='CONFLICT'||[400,401,409,413].includes(err.status)?'conflict':'offline';lastSyncError=err.message==='UPDATE_REQUIRED'?L('Обновете приложението на всички съдийски устройства.','Refresh the app on all judge devices.'):err.status===401?L('Проверете кода за достъп.','Check the access code.'):err.status===413?L('Архивът надвишава лимита за общата сесия.','The shared session size limit was exceeded.'):'';}finally{busy=false;$('#savebadge').innerHTML=badge();syncNotice();if(view==='connect'&&!$('#dialog').open&&!document.activeElement?.matches('input,textarea,select'))render();}}

 else if(act==='new'){const before=SM.clone(d());if(!await seasonConfirm(L('Да започна ново състезание? Първо ще се изтегли архив. Сезонът се запазва.','Start a new competition? A backup is downloaded first. The season is retained.')))return;if(JSON.stringify(before)!==JSON.stringify(d()))throw Error('CONFLICT');backup();const fresh=SM.fresh();if(d().season)fresh.season=SM.clone(d().season);if(d().audience)fresh.audience=SM.clone(d().audience);changeData(fresh,'new');drafts={};view='setup';standingsThrough=-1;athleteId='';eventIndex=0;persist();render();}
 else if(act==='downloadHtml'){const copy=document.documentElement.cloneNode(true);copy.querySelector('#main').innerHTML='';copy.querySelector('#nav').innerHTML='';copy.querySelector('#dialog').innerHTML='';copy.querySelector('#dialog').removeAttribute('open');copy.querySelector('#savebadge').innerHTML='';copy.querySelector('#toast').hidden=true;download('strongman-arena.html',new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html;charset=utf-8'}));}
 }catch(err){toast(t(err.message==='CONFLICT'?'stale':'error'));if(err.message==='CONFLICT'&&view==='scoring')restoreDraft();}});
function captureSetupDraft(){const f=$('#setupForm');if(f&&d().phase==='setup'){drafts.setup={base:drafts.setup?.base||setupFormBase||SM.clone(d()),values:Object.fromEntries(new FormData(f)),tie:$('#tie')?.value,zero:$('#zero')?.value};persist();}}
function applySetupDraft(){if(view!=='setup'||d().phase!=='setup'||!drafts.setup)return;for(const [k,v]of Object.entries(drafts.setup.values))if($('#setupForm').elements.namedItem(k))$('#setupForm [name="'+k+'"]').value=v;if($('#tie'))$('#tie').value=drafts.setup.tie;if($('#zero'))$('#zero').value=drafts.setup.zero;}
document.addEventListener('input',ev=>{if(ev.target.id==='search')filterCatalog();if(ev.target.closest('#eventForm')){drafts.event={id:$('#eventForm').dataset.id,base:drafts.event?.base||eventFormBase,values:Object.fromEntries(new FormData($('#eventForm')))};persist();}if(ev.target.closest('#resultForm'))captureDraft();if(ev.target.closest('#setupForm')||ev.target.closest('#rulesForm'))captureSetupDraft();});
document.addEventListener('change',ev=>{if(ev.target.closest('#eventForm')){drafts.event={id:$('#eventForm').dataset.id,base:drafts.event?.base||eventFormBase,values:Object.fromEntries(new FormData($('#eventForm')))};persist();}if(ev.target.id==='standingsThrough'){standingsThrough=Number(ev.target.value);persist();render();}if(ev.target.id==='group')filterCatalog();if(ev.target.id==='athlete'){captureDraft();athleteId=ev.target.value;persist();render();}if(ev.target.id==='status'){captureDraft();render();}if(ev.target.id==='mode'&&ev.target.closest('#eventForm')){const mode=ev.target.value;$('#target').previousElementSibling.textContent=t(mode==='race'?'targetdistance':'targetcount');$('#secondary').innerHTML=secondaryOptions(mode).map(([v,s])=>`<option value="${v}">${s}</option>`).join('');}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='resultForm')saveResult();if(ev.target.id==='setupForm')saveSetup();if(ev.target.id==='eventForm'){const f=ev.target;if(!f.reportValidity())return;const fd=Object.fromEntries(new FormData(f)),events=SM.clone(d().events),e=events.find(x=>x.id===f.dataset.id);e.names={bg:fd.bg.trim(),en:fd.en.trim()};e.mode=fd.mode;e.target=SM.number(fd.target);e.cap=SM.number(fd.cap);e.secondary=fd.secondary;e.weights=fd.weights;e.notes=fd.notes;e.reviewed=fd.reviewed==='on';if(!e.names.bg||!e.names.en||!Number.isFinite(e.target)||e.target<0||!Number.isFinite(e.cap)||e.cap<0||['race','series','medley'].includes(e.mode)&&e.target<=0||['series','medley'].includes(e.mode)&&!Number.isInteger(e.target)){toast(t('error'));return;}if(!['race','reps','series','medley','height'].includes(e.mode))e.secondary='none';try{const base=drafts.event?.base||eventFormBase;commit([{path:['data','events'],prev:base,next:events}],'Configure event: '+eventName(e));delete drafts.event;persist();$('#dialog').close();applySetupDraft();}catch{toast(t('error'));}}});
$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>30000000)throw Error();const parsed=JSON.parse(await file.text());if(parsed.app!=='StrongmanArena'||parsed.version!==1)throw Error();SM.validateDocument(parsed.doc);if(!await seasonConfirm(t('confirmrestore')))return;backup();if(sync){if(queue.length){toast(t('onlineleave'));return;}changeData(parsed.doc.data,'Restore competition');drafts=parsed.drafts||{};}else{doc=parsed.doc;queue=[];drafts=parsed.drafts||{};}view=d().phase==='setup'?'setup':'standings';persist();render();}catch{toast(t('invalidbackup'));}ev.target.value='';});
window.addEventListener('storage',ev=>{if(ev.key===STORE){readOnlyTab=true;storageNotice();toast(lang==='bg'?'Друга страница е променила данните. Използвайте една страница на устройство.':'Another tab changed data. Use one tab per device.');}});
window.addEventListener('beforeunload',ev=>{if(readOnlyTab)return;captureDraft();captureSetupDraft();persist();if(storagePending&&!storageDurable){ev.preventDefault();ev.returnValue='';}});
async function boot(){try{const saved=await SMStorage.load();if(saved&&(needsIndexedRecovery||saved.stamp>storageStamp)){loadSaved(JSON.parse(saved.payload));damagedStorage=null;needsIndexedRecovery=false;}else if(needsIndexedRecovery)damagedStorage=localStorage.getItem(STORE); }catch{if(needsIndexedRecovery)try{damagedStorage=localStorage.getItem(STORE);}catch{}}storageReady=true;render();applySetupDraft();if(drafts.event&&d().phase==='setup'&&d().events.some(e=>e.id===drafts.event.id)){editEvent(drafts.event.id);for(const [key,value]of Object.entries(drafts.event.values)){const element=$('#eventForm').elements.namedItem(key);if(element){if(element.type==='checkbox')element.checked=value==='on';else element.value=value;}}}setInterval(pump,1200);if(sync)pump();
storageNotice();}
boot();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')&&location.pathname.includes('/strongman/'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
