(function(){
 const key='sm-appearance-v1',media=matchMedia('(prefers-color-scheme: dark)');let choice=null;
 try{const saved=localStorage.getItem(key);if(['light','dark'].includes(saved))choice=saved;}catch{}
 const apply=()=>{const dark=(choice|| (media.matches?'dark':'light'))==='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';const bg=document.documentElement.lang==='bg';for(const b of document.querySelectorAll('[data-theme-toggle]')){b.textContent=(dark?'☀ ':'☾ ')+(bg?(dark?'Светло':'Тъмно'):(dark?'Light':'Dark'));b.setAttribute('aria-label',bg?(dark?'Превключи към светъл режим':'Превключи към тъмен режим'):(dark?'Switch to light mode':'Switch to dark mode'));b.setAttribute('aria-pressed',String(dark));}};
 apply();document.addEventListener('DOMContentLoaded',apply);new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
 document.addEventListener('click',ev=>{if(!ev.target.closest('[data-theme-toggle]'))return;choice=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(key,choice);}catch{}apply();});
 media.addEventListener('change',()=>{if(!choice)apply();});
 window.addEventListener('storage',ev=>{if(ev.key===key){choice=['dark','light'].includes(ev.newValue)?ev.newValue:null;apply();}});
 let printDetails=[];window.addEventListener('beforeprint',()=>{printDetails=[...document.querySelectorAll('main details')].filter(e=>!e.open&&!e.closest('.noprint'));printDetails.forEach(e=>e.open=true);});window.addEventListener('afterprint',()=>{printDetails.forEach(e=>e.open=false);printDetails=[];});
})();

:root{--ink:#15242c;--muted:#607078;--paper:#f4f5f1;--line:#dce1dc;--orange:#e84d24;--dark:#152a32;--green:#20764b;--white:#fff;--shadow:0 12px 40px #172c3210;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:12px 16px;min-height:46px;font-weight:650;transition:background .15s}button:hover{background:#f0f2ee}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--orange);color:white;border-color:var(--orange)}button.primary:hover{background:#cc3e19}button.dark{background:var(--dark);color:white}button.danger{color:#ac2525;border-color:#efc8c3}button.small{padding:7px 11px;font-size:.86rem;min-height:36px}input,select,textarea{width:100%;border:1px solid #bec9c5;background:white;color:var(--ink);border-radius:8px;min-height:48px;padding:11px 12px}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #e84d2450;outline-offset:2px}label{display:block;font-size:.85rem;font-weight:650;margin-bottom:7px}label.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;line-height:1.5}input[type=checkbox]{width:22px;min-height:22px;flex-shrink:0;accent-color:var(--orange)}.topbar{background:var(--dark);color:white;padding:19px max(24px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px;font-size:1.07rem;letter-spacing:.07em;font-weight:900}.brand svg{width:35px;height:35px;color:#ff7049}.brand small{display:block;font-size:.62rem;letter-spacing:.21em;color:#adbfbd;margin-top:3px}.topbar button{background:#ffffff12;color:white;border-color:#ffffff30}.topactions{display:flex;gap:8px;align-items:center}.savebadge{font-size:.76rem;max-width:220px;color:#b function zipFiles(files){

 const c=bytes(...central),end=bytes(u(0x06054b50,4),u(0,2),u(0,2),u(central.length,2),u(central.length,2),u(c.length,4),u(offset,4),u(0,2));return new Blob([...parts,c,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* A small localStorage copy plus IndexedDB for larger seasons and history. */
(function(){let dbPromise;function open(){if(!('indexedDB'in globalThis))return Promise.reject(Error('NO_INDEXED_DB'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('strongman-arena-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('sessions');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('STORAGE_BLOCKED'));});return dbPromise;}
 const api={async load(){const db=await open();return new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readonly'),req=tx.objectStore('sessions').get('active');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});},async save(payload,stamp){const db=await open();return new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readwrite'),table=tx.objectStore('sessions'),req=table.get('active');req.onsuccess=()=>{if(!req.result||req.result.stamp<=stamp)table.put({stamp,payload},'active');};tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('STORAGE_ABORT'));});}};
 globalThis.SMStorage=api;
})();

function seasonTable(s){const rows=SM.seasonScores(s);return `<div class="tablewrap"><table><thead><tr><th>${t('place')}</th><th>${t('name')}</th>${s.competitions.map((c,i)=>`<th>${i+1}. ${esc(c.data.title)}</th>`).join('')}<th>${t('total')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="rank">${r.tied?'=':''}${r.rank}</td><td class="name">${esc(r.athlete.name)}</td>${r.rounds.map(rr=>`<td>${rr?fmt(rr.points)+(rr.status==='ranked'?` <small class="caption">(#${rr.rank})</small>`:` · ${rr.status.toUpperCase()}`):'—'}</td>`).join('')}<td class="points">${fmt(r.total)}</td></tr>`).join('')}</tbody></table></div>`;}
function audienceCard(){return `<section class="card noprint"><h2>${L('Зрителски изглед','Visitor view')}</h2><p class="caption">${L('Публичен линк само за преглед: класиране, профили на състезателите и сезон. Без код за достъп и без редактиране. Съдийски бележки и история не се публикуват.','Public read-only link: standings, athlete profiles and season. No access code or editing. Judge notes and audit history stay private.')}</p><p><span class="badge ${d().audience?.enabled?'green':'orange'}">${d().audience?.enabled?L('Публикуването е включено','Publishing enabled'):L('Публикуването е изключено','Publishing disabled')}</span></p>${sync?`<div class="row">${button('audience',d().audience?.enabled?L('Изключи публичния изглед','Disable public view'):L('Активирай публичния изглед','Enable public view'),'primary')}${d().audience?.enabled?`<a class="actionlink" target="_blank" rel="noopener" href="${esc(visitorURL())}">${L('Отвори зрителския изглед','Open visitor view')} ↗</a>${button('copyVisitor',L('Копирай линка','Copy link'))}`:''}</div><p class="caption shareurl">${esc(visitorURL())}</p>${queue.length?`<p class="notice">${L('Промените ще са публични след успешна синхронизация.','Changes become public after successful sync.')}</p>`:''}`:`<p class="notice">${L('Свържете съдийското устройство с общата сесия, за да публикувате резултатите на живо.','Connect the judge device to the shared session to publish live results.')}</p>${button('nav',t('connect'),'dark','data-view="connect"')}`}</section>`;}
function seasonView(){const s=d().season;seasonFormBase=SM.clone(s||null);return hero('SEASON & LIVE',L('Сезон и публика','Season & visitors'),L('Един сезон. Всички кръгове. Проследим път до годишния победител.','One season. Every round. A clear path to the annual winner.'))+audienceCard()+(s?`<section class="card"><div class="row between"><div><span class="badge ${s.closed?'green':'orange'}">${s.closed?L('Финален сезон','Final season'):L('Текущ сезон','Season in progress')}</span><h2 style="margin-top:12px">${esc(s.title)} · ${s.year}</h2></div><div class="row noprint">${button('seasonCsv','CSV')}${button('seasonWord','Word')}${button('seasonPrint',t('print'))}</div></div><p class="caption">${esc(seasonRules(s))}</p>${s.competitions.length?seasonTable(s):`<div class="empty">${L('Все още няма добавен завършен кръг.','No finished round has been added yet.')}</div>`}${s.closed&&s.competitions.length?`<div class="notice good">${L('Годишен победител','Annual winner')}: <strong>${esc(SM.seasonScores(s).filter(r=>r.rank===1).map(r=>r.athlete.name).join(' / '))}</strong></div>`:''}</section><div class="layout"><div><section class="card noprint"><h2>${L('Текущо състезание → сезон','Current competition → season')}</h2><p class="caption">${L('Завършете всички дисциплини и натиснете „Приключи състезанието“. След това свържете всеки участник с постоянния му сезонен профил. При корекция на стар кръг го добавете отново със същия идентификатор — ще се обнови, без да се дублира.','Complete all events and finish the competition. Then match every entrant to their permanent season profile. After correcting an archived round, save it again using the same identifier: it updates without duplication.')}</p>${s.competitions.some(c=>c.id===d().id)?`<p class="notice ${JSON.stringify(s.competitions.find(c=>c.id===d().id).data)===JSON.stringify(SM.competitionSnapshot(d()))?'good':''}">${JSON.stringify(s.competitions.find(c=>c.id===d().id).data)===JSON.stringify(SM.competitionSnapshot(d()))?L('Текущият кръг е записан в сезона.','Current round saved in the season.'):L('Текущият кръг има промени. Обновете сезонния архив.','Current round has changed. Update the season archive.')}</p>`:''}${button('roundSave',s.competitions.some(c=>c.id===d().id)?L('Обнови този кръг в сезона','Update this round in season'):L('Добави завършения кръг','Add finished round'),'primary',s.closed||d().phase!=='finished'||!allComplete()?'disabled':'')} ${button('newRound',L('Следващо състезание','Next competition'),'',s.closed?'disabled':'')}</section><section class="card"><h2>${L('Архив на кръговете','Round archive')} · ${s.competitions.length}/40</h2>${s.competitions.map((c,i)=>`<details><summary>${i+1}. ${esc(c.data.title)} · ${esc(c.data.date)}</summary><p class="caption">${esc(c.data.venue)} · ${c.data.athletes.length} ${t('athletes')}</p><div class="tablewrap">${seasonRoundTable(c)}</div><div class="row noprint">${button('loadRound',L('Отвори за преглед / корекция','Open for review / correction'),'small',`data-id="${esc(c.id)}"`)}${!s.closed?button('removeRound',L('Изключи от сезона','Exclude from season'),'small danger',`data-id="${esc(c.id)}"`):''}</div></details>`).join('')}</section></div><aside><section class="card noprint"><h2>${L('Правила на сезона','Season rules')}</h2>${seasonForm(s)}<p class="caption">${L('Скалата и тайбрекът се фиксират след първия добавен кръг. Промените и изключените кръгове могат да се възстановят от История. Архивът JSON съдържа целия сезон.','The scale and tiebreak lock after the first round. Changes and excluded rounds can be restored in History. JSON backup includes the entire season.')}</p><div class="row">${button('seasonClose',s.closed?L('Отвори сезона за корекции','Reopen season for corrections'):L('Обяви финал на сезона','Finalize season'),'',!s.competitions.length?'disabled':'')}${button('backup',t('backup'))}</div></section><section class="card noprint"><h2>${L('Постоянни профили','Permanent profiles')}</h2><p class="caption">${L('Един и същ човек трябва да има един профил през целия сезон. Името може да се коригира, идентификаторът остава същият.','Use one profile per person throughout the season. Names can be corrected; identifiers stay the same.')}</p>${s.athletes.map(a=>`<div class="row between eventcard"><span>${esc(a.name)} <small class="caption">${esc(a.id.slice(0,8))}</small></span>${button('renameSeasonAthlete',L('Име','Name'),'small',`data-id="${esc(a.id)}"`)}</div>`).join('')}</section><section class="card dangerzone noprint">${button('seasonNew',L('Нов сезон','New season'),'danger')}</section></aside></div>`:`<section class="card"><h2>${L('Създай сезон','Create a season')}</h2><p class="caption">${L('Предложена организаторска скала, а не универсален федеративен правилник. Променете я преди първия кръг. Всички кръгове имат еднаква тежест.','Suggested organizer scale, not a universal federation rule. Adjust it before the first round. All rounds have equal weight.')}</p>${seasonForm(SM.seasonFresh())}</section>`);}
function seasonForm(s){return `<form id="seasonForm">${field('seasonTitle',L('Име на сезона','Season name'),s.title,'text','required maxlength="150"')}${field('seasonYear',L('Година','Year'),s.year,'number','required min="2000" max="2200"')}<fieldset ${s.competitions.length?'disabled':''} style="border:0;padding:0;margin:0">${field('seasonScale',L('Точки от първо място надолу — разделени с интервал','Points from first place down — separated by spaces'),s.scale.join(' '),'text','required')}${select('seasonTie',L('Равен годишен сбор','Equal annual totals'),[['countback',t('countback')],['shared',L('Споделено място','Shared place')]],s.tie)}</fieldset><button type="submit" class="dark">${t('save')}</button></form>`;}
function seasonRoundTable(c){return `<table><thead><tr><th>${t('place')}</th><th>${t('name')}</th><th>${t('total')}</th></tr></thead><tbody>${SM.standings(c.data).map(r=>`<tr><td>${r.tied?'=':''}${r.rank}</td><td class="name">${esc(r.athlete.name)}</td><td>${fmt(r.total)}</td></tr>`).join('')}</tbody></table>`;}
function openRoundMapping(){if(!d().season||d().season.closed||d().phase!=='finished'||!allComplete())return;roundFormBase=SM.clone(d().season);roundCompetitionBase=SM.competitionSnapshot(d());const s=roundFormBase,old=s.competitions.find(c=>c.id===d().id);$('#dialog').innerHTML=`<div class="inner"><div class="dialoghead"><h2>${L('Свържи сезонните профили','Match season profiles')}</h2>${button('close','×','icon',`aria-label="${t('close')}"`)}</div><p class="notice">${L('Проверете всяко съвпадение. При съименници изберете различни профили. Никой не се слива автоматично.','Review every match. Namesakes need separate profiles. Nobody is merged automatically.')}</p><form id="roundForm">${d().athletes.map((a,i)=>{const entry=old?.entries.find(e=>e.athleteId===a.id);const matched=entry?.seasonId||s.athletes.find(x=>x.name.trim().toLocaleLowerCase()===a.name.trim().toLocaleLowerCase())?.id||'new';const started=d().events.some(e=>['ok','dnf','zero'].includes(d().results[e.id]?.[a.id]?.status));return `<div class="card"><h3>${a.bib}. ${esc(a.name)}</h3>${select('match'+i,L('Сезонен профил','Season profile'),[['new',L('+ Нов профил','+ New profile')],...s.athletes.map(x=>[x.id,x.name+' · '+x.id.slice(0,8)])],matched)}${select('entryStatus'+i,L('Сезонни точки','Season points'),[['ranked',L('По крайното класиране','By final placing')],['dns',L('Без участие — 0 точки','No start — 0 points')],['dq',L('Дисквалифициран — 0 точки','Disqualified — 0 points')]],entry?.status||(started?'ranked':'dns'))}</div>`;}).join('')}<label class="check"><input type="checkbox" required>${L('Проверих профилите и окончателното класиране.','I checked the profiles and final results.')}</label><button type="submit" class="primary" style="margin-top:15px">${L('Запази кръга в сезона','Save round in season')}</button></form></div>`;$('#dialog').setAttribute('aria-label',$('#dialog').querySelector('h2')?.textContent||L('Диалог','Dialog'));$('#dialog').showModal();}
async function nextCompetition(){const baseline=SM.clone(d());if(queue.length){toast(t('onlineleave'));return;}if(d().athletes.length&&!d().season?.competitions.some(c=>c.id===d().id&&JSON.stringify(c.data)===JSON.stringify(SM.competitionSnapshot(d())))&&!await seasonConfirm(L('Текущото състезание още не е добавено в сезона или има незаписани корекции. Да продължа ли? JSON копие ще бъде изтеглено.','Current competition is not saved in the season or has unsaved corrections. Continue? A JSON backup will be downloaded.')))return;if(!await seasonConfirm(L('Да започна следващо състезание? Сезонът и архивираните кръгове се запазват.','Start the next competition? The season and archived rounds are retained.')))return;if(JSON.stringify(d())!==JSON.stringify(baseline))throw Error('CONFLICT');backup();const next=SM.fresh();if(d().season)next.season=SM.clone(d().season);if(d().audience)next.audience=SM.clone(d().audience);changeData(next,'Next competition (season retained)');drafts={};view='setup';standingsThrough=-1;athleteId='';eventIndex=0;persist();render();}
function seasonExportRows(s){return [[t('place'),t('name'),...s.competitions.map(c=>c.data.title),t('total')],...SM.seasonScores(s).map(r=>[(r.tied?'=':'')+r.rank,r.athlete.name,...r.rounds.map(x=>x?.points??''),r.total])];}
async function seasonAction(act,id){
 if(act==='audience'){commit([{path:['data','audience'],next:{enabled:!d().audience?.enabled}}],'Public viewer '+(!d().audience?.enabled?'enabled':'disabled'));return true;}
 if(act==='copyVisitor'){try{await navigator.clipboard.writeText(visitorURL());toast(L('Линкът е копиран','Link copied'));}catch{prompt(L('Копирайте линка','Copy this link'),visitorURL());}return true;}
 if(act==='roundSave'){openRoundMapping();return true;}
 if(act==='newRound'){await nextCompetition();return true;}
 if(act==='seasonNew'){if(!await seasonConfirm(L('Започване на нов сезон? Изтегля се JSON архив на текущите данни; старият сезон може да се възстанови и от История.','Start a new season? A JSON backup is downloaded; the old season can also be restored through History.')))return true;backup();const s=SM.seasonFresh();s.title=L('Сезон ','Season ')+s.year;commit([{path:['data','season'],next:s}],'New season');return true;}
 const s=d().season;if(!s)return false;
 if(act==='seasonClose'){if(!s.closed&&!SM.seasonScores(s).some(r=>r.total>0)){toast(L('Няма присъдени сезонни точки. Проверете участията, преди да обявите победител.','No season points have been awarded. Review entries before declaring a winner.'));return true;}if(!await seasonConfirm(s.closed?L('Да отворя сезона за корекции?','Reopen the season for corrections?'):L('Всички кръгове ли са добавени? Да обявя годишния победител?','Have all rounds been added? Finalize the annual winner?')))return true;commit([{path:['data','season','closed'],prev:s.closed,next:!s.closed}],'Season '+(s.closed?'reopened':'finalized'));return true;}
 if(act==='renameSeasonAthlete'){const name=await seasonConfirm(L('Ново име на сезонния профил','New season profile name'),s.athletes.find(a=>a.id===id)?.name);if(typeof name!=='string'||!name.trim()||name.length>150)return true;const athletes=SM.clone(s.athletes);athletes.find(a=>a.id===id).name=name.trim();commit([{path:['data','season','athletes'],prev:s.athletes,next:athletes}],'Rename season profile');return true;}
 if(act==='removeRound'){if(s.closed)return true;if(await seasonConfirm(L('Да изключа кръга от сезонния сбор? Може да се върне от История.','Exclude the round from season totals? Restore it through History.')))commit([{path:['data','season','competitions'],prev:s.competitions,next:s.competitions.filter(c=>c.id!==id)}],'Exclude round');return true;}
 if(act==='loadRound'){if(queue.length){toast(t('onlineleave'));return true;}if(!await seasonConfirm(L('Това ще смени текущото състезание за всички съдии. Да отворя архивирания кръг?','This changes the current competition for all judges. Open the archived round?')))return true;backup();const next=SM.clone(s.competitions.find(c=>c.id===id).data);next.season=SM.clone(s);if(d().audience)next.audience=SM.clone(d().audience);changeData(next,'Open archived round');drafts={};view='standings';standingsThrough=-1;persist();render();return true;}
 if(act==='seasonCsv'){download('strongman-season.csv',new Blob(['\ufeff'+seasonExportRows(s).map(row=>row.map(v=>'"'+SM.csvCell(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));return true;}
 if(act==='seasonWord'){download('strongman-season.docx',makeSeasonWord(s));return true;}
 if(act==='seasonPrint'){window.print();return true;}
 return false;
}
function restoreSeasonDraft(){if(view!=='season'||!drafts.seasonForm)return;const saved=drafts.seasonForm;if(JSON.stringify(saved.base)!==JSON.stringify(d().season||null))return;for(const [key,value]of Object.entries(saved.values)){const el=document.getElementById(key);if(el&&!el.disabled)el.value=value;}}
document.addEventListener('input',ev=>{if(ev.target.closest('#seasonForm')){drafts.seasonForm={base:seasonFormBase,values:Object.fromEntries(new FormData($('#seasonForm')))};persist();}});
document.addEventListener('change',ev=>{if(ev.target.closest('#seasonForm')){drafts.seasonForm={base:seasonFormBase,values:Object.fromEntries(new FormData($('#seasonForm')))};persist();}});
document.addEventListener('submit',ev=>{
 if(ev.target.id==='seasonForm'){ev.preventDefault();const fd=new FormData(ev.target);try{const s=SM.clone(seasonFormBase||SM.seasonFresh());s.title=String(fd.get('seasonTitle')).trim();s.year=Number(fd.get('seasonYear'));if(!s.competitions.length){s.scale=String(fd.get('seasonScale')).trim().split(/\s+/).map(SM.number);s.tie=fd.get('seasonTie');}SM.validateSeason(s);delete drafts.seasonForm;commit([{path:['data','season'],prev:seasonFormBase,next:s}],'Season settings');toast(t('saved'));}catch(err){toast(err.message==='CONFLICT'?t('stale'):L('Проверете името, годината и низходящата скала.','Check the name, year and descending point scale.'));}}
 if(ev.target.id==='roundForm'){ev.preventDefault();if(!ev.target.reportValidity())return;try{if(JSON.stringify(SM.competitionSnapshot(d()))!==JSON.stringify(roundCompetitionBase))throw Error('CONFLICT');const fd=new FormData(ev.target),s=SM.clone(roundFormBase),used=new Set();const entries=d().athletes.map((a,i)=>{let sid=fd.get('match'+i);if(sid==='new'){sid=SM.uid();s.athletes.push({id:sid,name:a.name});}if(used.has(sid))throw Error('DUPLICATE');used.add(sid);return {athleteId:a.id,seasonId:sid,status:fd.get('entryStatus'+i)};});const c={id:d().id,data:SM.competitionSnapshot(d()),entries};const i=s.competitions.findIndex(c=>c.id===d().id);if(i<0)s.competitions.push(c);else s.competitions[i]=c;SM.validateSeason(s);commit([{path:['data','season'],prev:roundFormBase,next:s}],'Save season round: '+d().title);$('#dialog').close();toast(t('saved'));}catch(err){toast(err.message==='DUPLICATE'?L('Двама участници не могат да са един сезонен профил.','Two entrants cannot share one season profile.'):err.message==='CONFLICT'?t('stale'):t('error'));}}
});


function seasonConfirm(message,value){return new Promise(resolve=>{const dialog=$('#dialog');dialog.innerHTML='<div class="inner"><h2>'+L('Потвърждение','Confirmation')+'</h2><p>'+esc(message)+'</p>'+(value===undefined?'':field('seasonAnswer',L('Име','Name'),value,'text','maxlength="150"'))+'<div class="row"><button type="button" class="primary" data-season-choice="yes">'+L('Потвърди','Confirm')+'</button><button type="button" data-season-choice="no">'+L('Отказ','Cancel')+'</button></div></div>';const done=answer=>{dialog.removeEventListener('click',click);dialog.removeEventListener('cancel',cancel);dialog.close();resolve(answer);};const click=ev=>{const b=ev.target.closest('[data-season-choice]');if(b)done(b.dataset.seasonChoice==='yes'?(value===undefined?true:$('#seasonAnswer').value):false);};const cancel=ev=>{ev.preventDefault();done(false);};dialog.addEventListener('click',click);dialog.addEventListener('cancel',cancel);dialog.setAttribute('aria-label',dialog.querySelector('h2')?.textContent||L('Потвърждение','Confirmation'));dialog.showModal();});}

 document.body.dataset.screen=view;if($('#roleLabel'))$('#roleLabel').textContent=L('Съдийски пулт','Referee desk');document.documentElement.lang=lang;document.title='Strongman Arena';$('#savebadge').innerHTML=badge();$('#language').textContent=lang==='bg'?'EN':'БГ';

 html=html.replace('<div id="resultFields">',`<div id="resultErrors" tabindex="-1" role="alert"></div>${e.mode==='race'?`<div class="segmented noprint" aria-label="${t('status')}">${button('quickStatus',L('Завършил · време','Finished · time'),(r.status||'ok')==='ok'?'active':'',`data-status="ok" aria-pressed="${(r.status||'ok')==='ok'}"`)}${button('quickStatus',L('Незавършил · метри','Unfinished · distance'),r.status==='dnf'?'active':'',`data-status="dnf" aria-pressed="${r.status==='dnf'}"`)}</div>`:''}<div id="resultFields">`);

function receiptStateText(){if(!storageDurable)return storagePending?L('Записване на устройството…','Saving on this device…'):L('Нужен е архив: записът на устройството не е потвърден.','Backup needed: device storage is not confirmed.');return sync&&queue.length?t('savepending'):sync&&net==='online'?t('synced'):L('Запазено на устройството','Saved on this device');}
function refreshFieldStatus(){const receipt=document.querySelector('[data-receipt-state]');if(receipt)receipt.textContent=receiptStateText();const connection=document.querySelector('#fieldConnection');if(connection)connection.innerHTML=badge();}

function reviewSteps(step){return `<ol class="review-steps noprint" aria-label="${L('Преглед след дисциплината','After-event review')}"><li ${step===1?'aria-current="step"':''}><span>1</span>${L('Обзор на дисциплината','Event overview')}</li><li ${step===2?'aria-current="step"':''}><span>2</span>${L('Временно класиране','Provisional standings')}</li><li><span>3</span>${eventIndex<d().events.length-1?L('Следваща дисциплина','Next event'):L('Приключване','Finish')}</li></ol>`;}
function openEventReview(index=eventIndex,saveEdits=true){
 if(!d().events.length||d().phase==='setup')return;
 if(saveEdits&&$('#resultForm')&&d().phase==='live'){captureDraft();if(hasUnfinishedDraft()&&saveResult(false)!==true)return;}
 eventIndex=Math.max(0,Math.min(index,d().events.length-1));view='eventReview';persist();render();window.scrollTo(0,0);$('#reviewHeading')?.focus();
}
function eventReviewView(){
 const c=d(),e=c.events[eventIndex];if(c.phase==='setup'||!e)return setupView();const rows=SM.eventScores(c,e),entered=rows.filter(r=>r.result).length,done=complete(e);
 return conanUnitNotice(e)+reviewSteps(1)+`<div class="desk-heading"><div><span class="eyebrow">${L('ДИСЦИПЛИНА','EVENT')} ${eventIndex+1} / ${c.events.length}</span><h1 id="reviewHeading" tabindex="-1">${L('Обзор на дисциплината','Event overview')}</h1><p class="caption">${esc(c.title)}</p></div><span class="badge ${done?'green':'orange'}">${entered}/${c.athletes.length} ${t('entered')}</span></div><section class="card"><h2>${esc(eventName(e))}</h2><p class="caption">${esc(summary(e))}</p><div class="notice ${done?'good':''}">${done?L('Всички резултати са записани.','All results are saved.')+'<span class="review-guidance"> '+L('Прегледайте местата и точките, след което продължете към временното общо класиране.','Review the places and points, then continue to the provisional overall standings.')+'</span>':L('Има липсващи резултати. Допълнете дисциплината, преди да продължите.','Some results are missing. Complete this event before continuing.')}</div>${queue.length?`<div class="notice">${t('pendingexport')}</div>`:''}<p class="caption noprint">${L('Натиснете реда на състезател, за да коригирате резултата му.','Select an athlete’s row to correct their result.')}</p><div class="tablewrap">${eventTable(e,rows,c.phase==='live')}</div></section><div class="review-actions noprint">${button('reviewEdit',L('← Към резултатите','← Back to scoring'))}${button('reviewStandings',L('Временно класиране →','Provisional standings →'),'primary',done?'':'disabled')}</div>`;
}
async function reviewAction(act,b){
 if(act==='reviewEvent'){openEventReview();return true;}
 if(act==='reviewStandings'){if(!complete(d().events[eventIndex])){toast(t('incomplete'));return true;}standingsThrough=eventIndex+1;view='eventStandings';persist();render();window.scrollTo(0,0);return true;}
 if(act==='reviewEdit'||act==='selectAthlete'&&view==='eventReview'){athleteId=b.dataset.id||athleteId||d().athletes[0]?.id;view='scoring';persist();render();($('#resultFields input')||$('#athlete'))?.focus();return true;}
 if(act==='reviewNext'){if(complete(d().events[eventIndex])&&eventIndex<d().events.length-1)resumeQueue(eventIndex+1);else toast(t('incomplete'));return true;}
 if(view==='scoring'&&['nextEvent','finish'].includes(act)&&complete(d().events[eventIndex])){openEventReview();return true;}
 return false;
}

function standingsResults(rows,events){

яват. За локален Wi-Fi без интернет е включен и допълнителен Node сървър.',syncOffline:'При прекъсване потвърдените записи се пазят локално и се изпращат след възстановяване на връзката. Едновременни редакции на един и същ резултат спират за разрешаване на конфликт. Различни резултати се обединяват.',connected:'Свързана обща сесия',waiting:'Локално чакащи промени',conflictText:'Друг съдия е променил същите данни. Локалните промени са запазени. Изтеглете архив, сравнете с историята и изберете дали да отхвърлите чакащите локални промени.',discard:'Изтегли копие и приеми сървърните данни',retry:'Опитай отново',new:'Започни ново състезание',newprompt:'Ще бъде изтеглен архив на текущото състезание. Въведете НОВО, за да започнете отначало.',confirmremove:'Да премахна ли дисциплината?',confirmjoin:'Текущите локални данни ще бъдат архивирани и заменени с общата сесия. Да продължа ли?',confirmrestore:'Архивът ще замени текущото състезание. Първо ще изтегля текущ архив. Да продължа ли?',connectfirst:'Първо въведете адреса и кода от сървъра.',serverempty:'Сървърът е празен. Използвайте „Създай обща сесия“.',serverexists:'Вече има обща сесия. Присъединете се към нея.',syncerror:'Неуспешна връзка. Проверете адреса, кода и мрежата.',error:'Проверете въведените данни.',storageerror:'Браузърът не позволи запазване! Изтеглете архив сега. Не затваряйте страницата.',notstarted:'Първо подгответе и започнете състезанието.',nocomplete:'Все още няма завършена дисциплина.',complete:'Завършени дисциплини',showdetails:'Подробни резултати',review:'Преглед',lastchange:'Последна промяна',printsign:'Главен съдия: ____________________    Организатор: ____________________',startorder:'Редът на стартовите номера е редът на имената. Организаторът определя реалния стартов ред.',savepending:'Запазено на устройството; чака сървъра.',allentered:'Всички резултати са въведени.',emptyNames:'Имената не съвпадат с броя или се повтарят.',invalidbackup:'Невалиден или неподдържан архив.',onlineleave:'Има чакащи ng ties stay shared. For a separate duel, record the decision in the signed protocol; do not add a points event for only the tied athletes as this changes overall scoring.',bgbody:'Bulgaria: sources document vehicle pulling, yoke, log, farmer’s walk, stones and medleys. Ruse University’s 2025 event used a 20 m tyre flip, kettlebell distance throw, 40 m farmer’s walk and 20 m car pull. These are event-specific parameters, not universal standards. A detailed public national rulebook covering all events was not located; confirm the actual rules with the organiser.',safetybody:'The app calculates performances accepted by referees; it cannot judge movement validity. Before starting, record commands, finish points, limits, precision, implement order, allowed equipment and infringement consequences. For stone-offs, duels, brackets and special Wessels tiebreaks use confirmed referee placings; the app does not manage a separate elimination tournament.',syncTitle:'One field. Shared results.',syncSub:'The standalone HTML works offline. A shared session needs a running server.',server:'Server address',key:'Access code',actor:'Judge name on this device',join:'Join shared session',publish:'Create shared session from this competition',disconnect:'Continue independently',syncHelp:'For Cloudflare, configure the SM_DB D1 binding and SM_KEY secret as described in DEPLOY-BG.md. Use the site address followed by /strongman. The first judge creates the session and the others join. For local Wi-Fi without internet, the optional included Node server is available.',syncOffline:'During an outage, saved changes stay on this device and upload after reconnection. Simultaneous edits to the same result pause for conflict resolution. Different results merge.',connected:'Connected shared session',waiting:'Changes waiting on this device',conflictText:'Another judge changed the same data. Your local changes are retained. Download a backup, compare the history, and choose whether to discard pending loc function loadSaved(saved){SM.validateDocument(saved.doc);for(const op of saved.queue||[])SM.validateOperation(op);doc=saved.doc;queue=saved.queue||[];let context=queue.flatMap(op=>op.changes).find(c=>c.path.length===1&&c.path[0]==='data')?.prev?.id||doc.data.id;queue=queue.map(op=>{const updated=op.competitionId?op:{...op,competitionId:context};const root=op.changes.find(c=>c.path.length===1);if(root?.next?.id)context=root.next.id;return updated;});sync=saved.sync||null;drafts=saved.drafts||{};view=saved.view||'overview';eventIndex=saved.eventIndex||0;athleteId=saved.athleteId||'';standingsThrough=Number.isInteger(saved.standingsThrough)?saved.standingsThrough:-1;storageStamp=saved.savedAt||0;}
try{const raw=localStorage.getItem(STORE),saved=JSON.parse(raw||'null');if(saved?.idb){needsIndexedRecovery=true;storageStamp=saved.savedAt||0;}else if(saved)loadSaved(saved);}catch{try{damagedStorage=localStorage.getItem(STORE);}catch{}}
function storageNotice(){refreshFieldStatus();if(readOnlyTab){$('#storageError').innerHTML='<div class="notice error">'+L('Друга съдийска страница на това устройство е активна. Обновете тази страница, преди да редактирате.','Another referee tab on this device is active. Reload this tab before editing.')+'</div>';return;}if(damagedStorage){$('#storageError').innerHTML='<div class="notice error">'+L('Локалният запис е повреден. Оригиналът е запазен и няма да се презаписва.','The saved record is invalid. The original is retained and will not be overwritten.')+' '+button('rawRecovery',L('Изтегли оригинала','Download original'))+' '+button('recoverEmpty',L('Нов празен запис','New empty record'))+'</div>';}else if(!storageDurable&&!storagePending){$('#storageError').innerHTML='<div class="notice error">'+t('storageerror')+' '+button('backup',t('backup'))+'</div>';}else $('#storageError').innerHTML='';}
function persist(){if(!storageReady||damagedStorage||readOnlyTab){storageNotice();return false;}const base={doc,queue,sync,drafts,view,eventIndex,athleteId,standingsThrough};const plain=JSON.stringify(base);if(plain===lastPayload)return storageDurable||storagePending>0;lastPayload=plain;const stamp=Math.max(Date.now(),storageStamp+1);storageStamp=stamp;const payload=JSON.stringify({...base,savedAt:stamp});let localOK=false;try{localStorage.setItem(STORE,payload);localOK=true;}catch{}storageDurable=localOK;storagePending++;storageNotice();SMStorage.save(payload,stamp).then(()=>{if(storageStamp===stamp){storageDurable=true;if(!localOK)try{localStorage.setItem(STORE,JSON.stringify({idb:true,savedAt:stamp}));}catch{}}}).catch(()=>{}).finally(()=>{storagePending--;storageNotice();if($('#savebadge'))$('#savebadge').innerHTML=badge();});return localOK||storagePending>0;}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
const actor=()=>sync?.actor||localStorage.getItem('sm-actor')||t('by');
function commit(changes,label,extra={}){if(damagedStorage||readOnlyTab)throw Error('DAMAGED_STORAGE');const op=SM.operation(doc,changes,label,actor(),extra);doc=SM.apply(doc,op);if(sync)queue.push(op);persist();render();if(sync)pump();return op;}
function changeData(data,label){return commit([{path:['data'],next:data}],label);}
const d=()=>doc.data, eventName=e=>e?.names?.[lang]||e?.names?.en||'', sourceLinks=ids=>(ids||[]).map(id=>{const s=SOURCES.find(x=>x.id===id);return s?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`:'';}).join('');
function button(act,label,cls='',attrs=''){return `<button type="button" data-act="${act}" class="${cls}" ${attrs}>${label}</button>`;}
function field(key,label,value='',type='text',attrs=''){return `<div class="field"><label for="${key}">${esc(label)}</label><input id="${key}" name="${key}" type="${type}" value="${esc(value)}" ${attrs}></div>`;}
function select(key,label,options,value){return `<div class="field"><label for="${key}">${esc(label)}</label><select id="${key}" name="${key}">${options.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;}

ents')}</div>`}</section></div><aside><section class="card sticky"><h2>03 &nbsp; ${t('rules')}</h2><form id="rulesForm"><fieldset ${locked?'disabled':''} style="border:0;padding:0;margin:0">${select('tie',t('tie'),['shared','countback','last'].map(k=>[k,t(k)]),data.rules.tie)}${select('zero',t('zero'),[['zero',t('zeropoints')],['rank',t('zerorank')]],data.rules.zero)}</fieldset></form><p class="caption">${t('rulehint')}</p><div class="help">${t('startorder')}</div>${!locked?`<div style="margin-top:20px"><label class="check"><input type="checkbox" id="startCheck">${t('startcheck')}</label>${button('start',t('start'),'primary','style="width:100%;margin-top:12px"')}</div>`:button('goScoring',t('scoring'),'primary','style="width:100%;margin-top:20px"')}</section></aside></div>`;}

function editEvent(id){eventFormBase=SM.clone(d().events);const e=d().events.find(x=>x.id===id),locked=d().phase!=='setup';openDialog(dialogHead(eventName(e))+conanUnitNotice(e)+`<div class="notice">${t('suggested')}</div><form id="eventForm" data-id="${e.id}"><fieldset ${locked?'disabled':''} style="border:0;margin:0;padding:0"><div class="grid">${field('bg',t('eventbg'),e.names.bg,'text','required maxlength="150"')}${field('en',t('eventen'),e.names.en,'text','required maxlength="150"')}</div>${select('mode',t('mode'),modesOptions(),e.mode)}<div id="distanceUnitField" ${e.mode==='distance'?'':'hidden'}>${select('unit',L('Мерна единица','Unit'),[['m',L('Метри — m','Metres — m')],['deg',L('Градуси — °','Degrees — °')]],e.unit||'m')}</div><div class="grid">${field('target',t(e.mode==='race'?'targetdistance':'targetcount'),e.target,'text','inputmode="decimal"')}${field('cap',t('cap'),e.cap,'text','inputmode="decimal"')}</div>${select('secondary',t('secondary'),secondaryOptions(e.mode),e.secondary)}${field('weights',t('weights'),e.weights,'text','maxlength="500"')}<div class="field"><label for="notes">${t('notes')}</label><textarea name="notes" id="notes" maxlength="4000">${esc(e.notes)}</textarea></div><label class="check"><input type="checkbox" name="reviewed" ${e.reviewed?'checked':''}>${t('reviewed')}</label>${!locked?`<div class="savebar"><button class="primary" type="submit">${t('save')}</button></div>`:''}</fieldset></form><details><summary>${t('sources')}</summary><div class="sources">${sourceLinks(e.sources)}</div></details>`);}
function saveSetup(silent=false){const f=$('#setupForm');if(!f||d().phase!=='setup')return true;const fd=new FormData(f),names=String(fd.get('names')).split('\n').map(x=>x.trim()).filter(Boolean),n=Number(fd.get('count'));if(names.length!==n||n<2||n>150||new Set(names.map(s=>s.toLocaleLowerCase())).size!==n){if(!silent)toast(t('emptyNames'));return false;}const data=SM.clone(d());data.title=String(fd.get('title')).trim()||'Strongman';data.date=String(fd.get('date'));data.venue=String(fd.get('venue')).trim();data.athletes=names.map((name,i)=>({id:data.athletes[i]?.id||SM.uid(),name,bib:i+1}));data.rules={tie:$('#tie').value,zero:$('#zero').value};const base=drafts.setup?.base||setupFormBase||d();const changes=['title','date','venue','athletes','rules'].filter(k=>JSON.stringify(data[k])!==JSON.stringify(base[k])).map(k=>({path:['data',k],prev:base[k],next:data[k]}));if(changes.length)commit(changes,'setup');delete drafts.setup;persist();render();return true;}
function modeRule(e){if(e.mode==='distance'&&e.unit==='deg')return L('По-големият общ ъгъл печели. Една обиколка = 360°. Въведете всички обиколки плюс остатъка в градуси: 2 обиколки + 90° = 810°. Няма ограничение до 360°. Равните градуси делят точките.','The greatest total angle wins. One revolution = 360°. Enter all revolutions plus the remainder in degrees: 2 revolutions + 90° = 810°. Values may exceed 360°. Equal angles share points.');const bg={race:'Завършилите са пред всички незавършили и се подреждат по по-кратко време. Незавършилите — по повече изминати метри. Равно разстояние е равен резултат, освен ако предварително е избрано време до измервателната точка.',reps:'Броят се само повторенията, признати от съдията. При равен брой точките се делят, освен ако предварително е включено време до последното зачетено повторение.',max:'Сравнява се най-тежкият успешен опит. Еднаквите тежести са равни; телесно тегло и брой опити не се използват автоматично. Запишете опитите в бележката.',hold:'По-дългото валидно задържане печели. Времето се спира при съдийския критерий за загуба на позиция или хват.',distance:'По-голямата валидна дистанция в метри печели. За Колелото на Конан използвайте мерна единица „Градуси“.',series:'Повече завършени снаряди или стъпки печелят. При включено време се сравнява времето до последния зачетен успех; при „само пълна серия“ частичните равни бройки делят точки.',medley:'Първо повече завършени етапи, после повече метри в следващия етап, после времето според избраната настройка. Не събирайте несъпоставими метри от различни етапи. Необходима е ясна последователност.',height:'По-голяма успешно преодоляна височина печели. Само ако е включено: по-малко неуспехи на най-добрата височина, после по-малко общо. Иначе равното постижение дели точки.',tiers:'Повече повторения с най-тежкия уред печелят, после със средния, после с най-лекия. Едно тежко повторение побеждава произволен брой по-леки. Тежестите и редът трябва да са еднакви за всички.',manual:t('manualhint')},en={race:'Finishers rank ahead of every non-finisher and are ordered by faster time. Non-finishers rank by greater distance. Equal distance ties unless time to a measured checkpoint was agreed in advance.',reps:'Count only referee-approved repetitions. Equal counts share points unless time to the last valid rep was enabled before the start.',max:'Rank the heaviest successful attempt. Equal weights tie. Bodyweight and attempt count are not automatic tiebreakers. Record attempts in the note.',hold:'The longest valid hold wins. Timing ends at the referee’s defined position or grip failure.',distance:'The greatest valid distance in metres wins. For Conan’s wheel choose the Degrees unit.',series:'More completed implements or steps wins. If timing is enabled use the split at the last valid success. With finishers-only timing, equal partial counts share points.',medley:'Compare completed stages first, then metres into the next stage, then time under the selected policy. Do not add incomparable metres from different stages. Define a clear stage order.',height:'Greater successful height wins. Only when enabled: fewer misses at the best height, then fewer total misses. Otherwise equal heights share points.',tiers:'Compare heavy reps first, then medium reps, then light reps. One heavier rep beats any number of lighter reps. Loads and order must be the same for everyone.',manual:t('manualhint')};return (lang==='bg'?bg:en)[e.mode];}
function resultFields(e,r={}){const active=['ok','dnf'].includes(r.status||'ok');if(!active)return '';const inp=(k,label,major=false)=>{let html=field(k,t(label),r[k]??'','text',`inputmode="decimal" autocomplete="off"`);const unit={time:'s',distance:SM.distanceUnit(e),weight:'kg',reps:L('повт.','reps'),height:'m',count:e.target?'/ '+e.target:''}[k];if(major&&unit)html=html.replace('<input','<div class="measurement-entry"><input').replace(/<\/div>$/,`<span class="measurement-unit" aria-hidden="true">${esc(unit)}</span></div></div>`);return `<div class="${major?'major':''}">${html}</div>`;};let html='';switch(e.mode){case'race':html=r.status==='dnf'?inp('distance','distancefield',true)+(e.secondary==='all'?inp('time','time'):''):inp('time','time',true);break;case'reps':html=inp('reps','repsfield',true)+(e.secondary==='all'?inp('time','time'):'');break;case'max':html=inp('weight','weight',true);break;case'hold':html=inp('time','holdfield',true);break;case'distance':html=inp('distance',e.unit==='deg'?'degreesfield':'distancefield',true)+(e.unit==='deg'?'<p class="caption">'+L('1 обиколка = 360° · 2 обиколки + 90° = 810°. Въведете общия ъгъл.','1 revolution = 360° · 2 revolutions + 90° = 810°. Enter the total angle.')+'</p>':'');break;case'series':case'medley':html=inp('count','countfield',true)+(e.mode==='medley'?inp('partial','partial'):'')+(e.secondary!=='none'?inp('time','time'):'');break;case'height':html=inp('height','heightfield',true)+(e.secondary==='all'?`<div class="grid">${inp('misses','misses')}${inp('totalMisses','totalMisses')}</div>`:'');break;case'tiers':html=inp('heavy','heavy')+inp('medium','medium')+inp('light','light');break;case'manual':html=inp('placing','placing',true);break;}return html;}
function draftKey(){return d().id+':'+(d().events[eventIndex]?.id||'')+':'+athleteId;}
function draftResult(){return drafts[draftKey()]?.values||d().results[d().events[eventIndex]?.id]?.[athleteId]||{status:'ok'};}

function completedPrefix(){let n=0;for(const e of d().events){if(!complete(e))break;n++;}return n;}
function checkpointBanner(){const n=completedPrefix();if(!n)return '';const rows=SM.standings(d(),n);return '<section class="notice good row between" id="checkpointBanner"><div class="grow"><strong>'+t('afterEvent')+' '+n+' · '+esc(eventName(d().events[n-1]))+'</strong><p class="caption" style="margin:6px 0 0">'+rows.slice(0,3).map(r=>(r.tied?'=':'')+r.rank+'. '+esc(r.athlete.name)+' · '+fmt(r.total)+' '+t('points').toLowerCase()).join(' &nbsp; / &nbsp; ')+'</p></div>'+button('checkpoint',t('viewCurrent'),'small', 'data-through="'+n+'"')+'</section>';}

function baseScoringView(){if(d().phase==='setup')return hero('FIELD DESK',t('scoring'),t('notstarted'))+button('setup',t('setup'),'primary');const e=d().events[eventIndex];if(!e)return '';if(!d().athletes.some(a=>a.id===athleteId))athleteId=d().athletes[0]?.id;const r=draftResult(),rows=SM.eventScores(d(),e),entered=rows.filter(x=>x.result).length;return hero(d().phase==='finished'?t('done'):t('running'),d().title||'Strongman',`${d().venue} · ${d().date}`,`<div class="stats"><div><div class="stat">${d().events.filter(complete).length}/${d().events.length}</div><span class="caption">${t('complete')}</span></div></div>`)+'<div id="checkpointRegion">'+checkpointBanner()+'</div>'+`<div class="eventtabs noprint">${d().events.map((ev,i)=>button('selectEvent',`${complete(ev)?'✓ ':''}${i+1}. ${esc(eventName(ev))}`,i===eventIndex?'active':'',`data-index="${i}"`)).join('')}</div><div class="layout"><div><section class="card"><div class="runhead"><span class="stepnum">${eventIndex+1}</span><div><span class="eyebrow">${t('event')} ${eventIndex+1} ${t('of')} ${d().events.length}</span><h2 style="margin:5px 0 0">${esc(eventName(e))}</h2></div></div><div class="metricline"><span class="badge">${esc(summary(e))}</span><span class="badge ${complete(e)?'green':'orange'}">${entered}/${rows.length} ${t('entered')}</span></div><div class="progress"><i style="width:${100*entered/rows.length}%"></i></div><details><summary>${t('rules')}</summary><p class="caption">${modeRule(e)}</p><p class="eventnote caption">${esc(e.weights)}<br>${esc(e.notes)}</p></details><form id="resultForm" class="resultinput" data-event="${e.id}" data-athlete="${athleteId}">${select('athlete',t('selectathlete'),d().athletes.map(a=>[a.id,`${a.bib}. ${a.name}${d().results[e.id]?.[a.id]?' ✓':''}`]),athleteId)}<fieldset ${d().phase==='finished'?'disabled':''} style="border:0;padding:0;margin:0">${select('status',t('status'),[['ok',t('ok')],...(e.mode==='race'?[['dnf',t('dnf')]]:[]),['zero',t('zeroStatus')],['dns',t('dns')],['wd',t('wd')],['dq',t('dq')]],r.status||'ok')}<div id="resultFields">${resultFields(e,r)}</div><details ${Number(r.penalty)>0||Number(r.deduction)>0?'open':''}><summary>${t('penalty')} / ${t('deduction')}</summary><div class="grid">${field('penalty',t('penalty'),r.penalty||0,'text','inputmode="decimal"')}${field('deduction',t('deduction'),r.deduction||0,'text','inputmode="decimal"')}</div></details><div class="field"><label for="note">${t('resultnote')}</label><textarea id="note" name="note" maxlength="4000">${esc(r.note||'')}</textarea><p class="caption">${t('resultnotehelp')}</p></div><p class="caption" id="draftInfo">${t('draft')}</p><div class="savebar"><button type="submit" class="dark">${t('save')}</button>${button('saveNext',t('saveNext'),'primary')}</div></fieldset></form>${d().phase==='finished'?button('reopen',t('reopen'),'primary'):''}</section><div class="row between noprint">${button('prevEvent','← '+t('previous'),'',''+(eventIndex===0?'disabled':''))}${eventIndex<d().events.length-1?button('nextEvent',t('next')+' →','dark',!complete(e)?'disabled':''):button('finish',t('finish'),'primary',!allComplete()?'disabled':'')}</div><p class="caption" style="margin-top:12px">${t('finishhint')}</p></div><aside><div class="card"><h2>${t('event')} ${eventIndex+1} · ${t('standings')}</h2><div class="tablewrap" id="eventLeaderboard">${eventTable(e,rows,true)}</div></div><div class="scorebox"><h2>${t('standings')}</h2><table><tbody id="overallLeaderboard">${SM.standings(d()).slice(0,5).map(r=>`<tr><td>${r.rank}</td><td>${esc(r.athlete.name)}</td><td class="points">${fmt(r.total)}</td></tr>`).join('')}</tbody></table>${button('standings',t('showdetails'),'small','style="margin-top:14px"')}</div><p class="caption">${t('precision')}</p></aside></div>`;}
function performance(e,r){if(!r)return '—';if(['zero','dns','wd','dq'].includes(r.status))return t(r.status==='zero'?'zeroStatus':r.status);let s='';switch(e.mode){case'race':s=r.status==='dnf'?`${fmt(r.distance)} m · DNF`:`${fmt(r.time)} s`;break;case'reps':s=`${r.reps} ${lang==='bg'?'повт.':'reps'}`;break;case'max':s=`${fmt(r.weight)} kg`;break;case'hold':s=`${fmt(r.time)} s`;break;case'distance':s=`${fmt(r.distance)} ${SM.distanceUnit(e)}`;break;case'series':case'medley':s=`${r.count}/${e.target}`+(e.mode==='medley'&&r.partial?` + ${fmt(r.partial)} m`:'');break;case'height':s=`${fmt(r.height)} m`+(e.secondary==='all'?` (${r.misses}/${r.totalMisses})`:'');break;case'tiers':s=`${r.heavy} / ${r.medium} / ${r.light}`;break;case'manual':s=`#${r.placing}`;}
 if(['reps','series','medley'].includes(e.mode)&&r.time&&e.secondary!=='none')s+=` · ${fmt(r.time)} s`;if(r.penalty)s+=` +${fmt(r.penalty)} s`;if(r.deduction)s+=` −${fmt(r.deduction)} ${t('points').toLowerCase()}`;return s;}
function eventTable(e,rows,clickable=false){return `<table><thead><tr><th>${t('place')}</th><th>${t('name')}</th><th>${t('result')}</th><th>${t('points')}</th></tr></thead><tbody>${rows.map(r=>`<tr ${clickable?`class="resultrow" data-act="selectAthlete" data-id="${r.athlete.id}" tabindex="0"`:''}><td class="rank ${r.rank===1?'top':''}">${r.rank?(r.tied?'=':'')+r.rank:'—'}</td><td class="name">${esc(r.athlete.name)}</td><td>${esc(performance(e,r.result))}</td><td class="points">${r.points===null?'—':fmt(r.points)}</td></tr>`).join('')}</tbody></table>`;}
function captureDraft(){const f=$('#resultForm');if(!f)return;const values=Object.fromEntries(new FormData(f));delete values.athlete;const old=drafts[draftKey()];drafts[draftKey()]={values,base:old&&Object.hasOwn(old,'base')?old.base:SM.clone(SM.get(doc,['data','results',f.dataset.event,f.dataset.athlete])),at:new Date().toISOString()};persist();}

 if(!d||d.schema!==1||!safeId(d.id)||!Array.isArray(d.athletes)||!Array.isArray(d.events)||!d.results||Array.isArray(d.results)||!d.rules||typeof d.title!=='string'||d.title.length>150||typeof d.venue!=='string'||d.venue.length>200||typeof d.date!=='string')throw Error('INVALID_DATA');\r\n if(d.athletes.length>150||d.events.length>50)throw Error('LIMIT');\r\n if(!['setup','live','finished'].includes(d.phase)||!['shared','countback','last'].includes(d.rules.tie)||!['zero','rank'].includes(d.rules.zero))throw Error('INVALID_RULES');\r\n const ids=new Set(),bibs=new Set();for(const a of d.athletes){if(!safeId(a.id)||ids.has(a.id)||typeof a.name!=='string'||!a.name.trim()||a.name.length>150||!Number.isSafeInteger(a.bib)||a.bib\u003c1||a.bib>150||bibs.has(a.bib))throw Error('INVALID_ATHLETE');ids.add(a.id);bibs.add(a.bib);}\r\n const eids=new Set();for(const e of d.events){if(e.unit!==undefined&&(!['m','deg'].includes(e.unit)||e.mode!=='distance'))throw Error('INVALID_EVENT_UNIT');if(!e.id||eids.has(e.id)||!modes.includes(e.mode)||!e.names||typeof e.names.bg!=='string'||typeof e.names.en!=='string'||!['none','all','finishers'].includes(e.secondary)||!Number.isFinite(e.target)||e.target\u003c0||!Number.isFinite(e.cap)||e.cap\u003c0)throw Error('INVALID_EVENT');eids.add(e.id);}\r\n for(const [eid,rr] of Object.entries(d.results)){const e=d.events.find(x=>x.id===eid);if(!e)throw Error('INVALID_EVENT_RESULT');for(const [aid,r]of Object.entries(rr)){if(!ids.has(aid))throw Error('INVALID_ATHLETE_RESULT');validateResult(e,r);}}\r\n for(const e of d.events){if(!safeId(e.id)||e.names.bg.length>150||e.names.en.length>150||e.cap>1e9||e.target>1e9)throw Error('INVALID_EVENT');if(d.phase!=='setup'||e.reviewed){if(['race','series','medley'].includes(e.mode)&&e.target\u003c=0||['series','medley'].includes(e.mode)&&!Number.isSafeInteger(e.target)||!['race','reps','series','medley','height'].includes(e.mode)&&e.secondary!=='none'||e.secondary==='finishers'&&!['series','medley'].includes( rget&&r.partial)throw Error('PARTIAL_FINISH');}if(r.count>0&&(e.secondary==='all'||e.secondary==='finishers'&&r.count===e.target)){positive('time');if(e.cap&&r.time>e.cap)throw Error('TIME_CAP');}break;\r\n case 'height':positive('height',true);if(e.secondary==='all'){positive('misses',true);positive('totalMisses',true);if(!Number.isInteger(r.misses)||!Number.isInteger(r.totalMisses)||r.misses>r.totalMisses)throw Error('INVALID_MISSES');}break;\r\n case 'tiers':for(const k of ['heavy','medium','light']){positive(k,true);if(!Number.isInteger(r[k]))throw Error('INTEGER');}break;\r\n case 'manual':positive('placing');if(!Number.isInteger(r.placing)||!r.note?.trim())throw Error('MANUAL_NOTE');break;\r\n }\r\n if(r.penalty&&!(e.mode==='race'&&r.status==='ok'||['reps','series','medley'].includes(e.mode)&&e.secondary!=='none'))throw Error('INVALID_TIME_PENALTY');\r\n return true;\r\n}\r\nfunction key(e,r){\r\n const t=round((r.time||0)+(r.penalty||0));\r\n switch(e.mode){\r\n case 'race':return r.status==='ok'?[1,-t,0]:[0,round(r.distance||0),e.secondary==='all'&&r.distance>0?-t:0];\r\n case 'reps':return [r.reps||0,e.secondary==='all'&&r.reps>0?-t:0];\r\n case 'max':return [round(r.weight||0)];case 'hold':return [round(r.time||0)];case 'distance':return [round(r.distance||0)];\r\n case 'series':case 'medley':return [r.count||0,e.mode==='medley'?round(r.partial||0):0,(e.secondary==='all'||e.secondary==='finishers'&&r.count===e.target)&&r.count>0?-t:0];\r\n case 'height':return [round(r.height||0),e.secondary==='all'?-(r.misses||0):0,e.secondary==='all'?-(r.totalMisses||0):0];\r\n case 'tiers':return [r.heavy||0,r.medium||0,r.light||0];case 'manual':return [-r.placing];\r\n }\r\n}\r\nfunction compare(a,b){for(let i=0;i\u003cMath.max(a.length,b.length);i++){const diff=(b[i]||0)-(a[i]||0);if(diff)return diff;}return 0;}\r\nfunction zero(e,r){if(r.status==='zero')return true;if(r.status==='dnf')return !round(r.distance);switch(e.mode){case'race':return false;case'reps':return  add('catalog','2. Каталог дисциплини','2. Event catalogue','Търси дисциплина на български или английски. Шаблонът е начало; организаторът потвърждава конкретните технически правила.','Search in Bulgarian or English. Templates are starting points; the organizer confirms the event’s technical rules.',record(prepared,'setup'),{action:'catalog'});
 add('event-settings','3. Параметри на дисциплина','3. Event parameters','За камиона задаваме 20 m и лимит 75 s. Тук са начинът на измерване, единиците, тайбрекът и потвърждението на правилата.','The sample truck pull is 20 m with a 75 s cap. Configure measurement, units, tiebreaks and confirm the rules here.',record(prepared,'setup'),{action:'settings'});
 add('rules','4. Точки, равенства и нули','4. Points, ties and zeros','При 4 участници местата носят 4, 3, 2, 1 точки. Равните резултати делят средното за заетите места. Правилата и източниците са достъпни тук.','Four entrants receive 4, 3, 2, 1 points by place. Ties average the occupied positions. Read the scoring rules and sources here.',record(prepared,'guide'));
 add('start','5. Потвърждение и старт','5. Confirm and start','Преди старт проверяваме списъка, дисциплините и правилата. Отметката и „Започни състезанието“ фиксират настройките. Можеш да го пробваш.','Review athletes, events and rules. The confirmation checkbox and Start competition lock setup. You can try starting.',record(prepared,'setup'),{target:'#startCheck'});
 add('time','6. Въвеждане на време','6. Enter a time','За завършил камиона въвеждаме 42,37 s. „Запази → следващ“ записва резултата и избира следващия без резултат. Пробвай бутона.','A completed truck pull takes 42.37 s. Save → next records it and selects the next missing athlete. Try the button.',draft(record(started,'scoring'),'demo-truck','demo-a0',r({time:42.37})),{target:'#time'});
 add('dnf','7. Незавършил и последен участник','7. Unfinished and final entrant','Този участник е изминал 18,5 m. Завършилите са пред незавършилите. Последният запис води към обзор, а не прескача към нова дисциплина.','This entrant completed 18.5 m. Finishers rank ahead of unfinished attempts. Saving the last missing result opens the event review.',draft(record(beforeLast[0],'scoring',{athleteId:'demo-a3'}),'demo-truck','demo-a3',r({status:'dnf',distance:18.5})),{target:'#distance'});
 add('review','8. Обзор на дисциплината','8. Event overview','Двамата с 18,5 m делят 3–4 място: (2 + 1) / 2 = 1,5 т. Натисни ред за корекция или продължи към временното класиране.','The two 18.5 m results share third/fourth: (2 + 1) / 2 = 1.5 points. Select a row to correct it or continue to provisional standings.',record(completed[0],'eventReview'));
 add('checkpoint','9. Временно класиране','9. Provisional standings','Това е общият сбор само след дисциплина 1. Бъдещи дисциплини не участват. След прегледа бутонът води към следващата дисциплина.','These totals include event 1 only. Future events are excluded. After reviewing, continue directly to the next event.',record(completed[0],'eventStandings'));
 add('programme','10. Програма и напредък','10. Programme and progress','Завършени, текущи и предстоящи дисциплини се виждат отделно. Оттук се влиза директно в точкуването или обзора.','Completed, current and upcoming events are clearly marked. Open scoring or review directly from the programme.',record(completed[0],'programme'));
 add('degrees','11. Колелото на Конан — градуси','11. Conan’s wheel — degrees','810° означава две обиколки и още 90°. По-големият общ ъгъл печели. Равните стойности делят точки; не се въвеждат метри.','810° is two complete turns plus 90°. The larger total angle wins. Equal angles share points. This event uses degrees.',draft(record(completed[0],'scoring',{eventIndex:1}),'demo-conan','demo-a0',r({distance:810})),{target:'#distance'});
 add('statuses','12. Повторения, нулев опит и наказания','12. Repetitions, zero and penalties','Последният участник няма зачетено повторение: избран е „Нулев резултат“. DNS, WD и DQ са отделни статуси. Бележките и наказанията са под формата.','The last entrant has no valid rep: Zero is selected. DNS, WD and DQ are separate statuses. Notes and penalties are below the fields.',draft(record(beforeLast[2],'scoring',{eventIndex:2,athleteId:'demo-a3'}),'demo-dead','demo-a3',r({status:'zero'})),{target:'#status'});
 add('history','13. История, Undo и Redo','13. History, Undo and Redo','Всеки запис има история преди/след. Пробвай Undo и Redo. Реалните резултати остават извън демото.','Every saved change retains before/after history. Try Undo and Redo. Your real results are outside this demo.',record(completed[2],'history'));
 add('finish','14. Преглед и приключване','14. Review and finish','След последната дисциплина отново виждаме временното класиране. Само изричното „Приключи състезанието“ обявява финал.','Review the totals after the last event. Only the explicit Finish competition action marks the results final.',record(completed[2],'eventStandings',{eventIndex:2}));
 add('exports','15. Финални резултати и файлове','15. Final results and files','Общият сбор е до името. Натисни Word, CSV или JSON, после „Изтегли демо файла“ над примера. Файлът съдържа примерни данни. Изтеглянията и печатът са само по твой избор.','Totals sit beside each athlete. Choose Word, CSV or JSON, then Download demo file above the sample. The file contains sample data. Printing and downloads start only when you choose them.',record(finished,'standings'));
 add('connection','16. Общи резултати — симулация','16. Shared results — simulation','В реална сесия всички съдии използват организаторския код. Тук сървърът и кодът са фиктивни. Можеш да провериш връзката безопасно.','Real judges use the organizer’s access code. Here the server and code are fictional. You can safely test the connection.',record(finished,'connect',{sync:connected}));
 add('offline','17. Без интернет и чакащ запис','17. Offline and queued score','Симулирано е прекъсване. Един резултат чака изпращане. В реалното приложение локалните записи и чернови се пазят при рефреш.','A simulated outage leaves one score queued. In the real application local scores and drafts survive refresh.',record(queued,'connect',{sync:connected,queue:[op]}),{offline:true,remoteDoc:queuedBase});
 add('reconnect','18. Възстановена връзка','18. Reconnected','Същият чакащ запис се изпраща веднъж към симулирания сървър. Зеленото потвърждение означава успешна синхронизация.','The same queued score is sent once to the simulated server. Green confirmation means synchronization succeeded.',record(queued,'connect',{sync:connected,queue:[op]}),{remoteDoc:queuedBase});
 add('spectators','19. Публично класиране','19. Public standings','Публиката вижда общите точки и постижението, без съдийски код и без редакция. Цветът е лилав за общото класиране.','Visitors see total points and performances without a referee code or editing access. Purple identifies overall standings.',record(finished,'standings'),{role:'visitor'});
 add('event-results','20. Резултати по дисциплина','20. Results by event','Синьото показва резултат само за избраната дисциплина. Смени дисциплината или натисни състезател за подробности.','Blue identifies results for one event only. Change the event or select an athlete for details.',record(finished,'standings'),{role:'visitor',visitor:{selectedEvent:'demo-truck'}});
 add('profile','21. Представяне на състезател','21. Athlete performances','Всички постижения, места и точки на един човек са събрани тук. „Следи“ го маркира, без да променя класирането.','All performances, places and points for one athlete appear here. Follow highlights the athlete without changing rank order.',record(finished,'standings'),{role:'visitor',visitor:{athleteId:'demo-a2'}});
 add('tv','22. Екран за публика / TV','22. Venue display / TV','Режимът е подходящ за голям екран. При повече участници страниците се сменят автоматично. Изход или Esc връща нормалния изглед.','Use this mode on a venue display. Larger fields paginate automatically. Exit or Escape returns to the normal viewer.',record(finished,'standings'),{role:'visitor',action:'tv'});
 add('season','23. Цял сезон и постоянни профили','23. Season and permanent profiles','Двата примерни кръга използват едни и същи профили. Всички кръгове се броят с фиксираната скала 25 / 20 / 16…; архивът позволява корекции.','Both sample rounds use stable athlete profiles. All rounds count on the fixed 25 / 20 / 16… scale. Archived rounds support corrections.',record(annual,'season'));
 add('champion','24. Годишно класиране за публика','24. Public annual standings','Сезонът е обявен за приключен. Годишният победител се вижда публично; равните сборове се решават по предварителните правила.','The season is finalized. Visitors can see the annual winner. Tied totals follow the configured season tiebreak.',record(champion,'season'),{role:'visitor',visitor:{tab:'season'}});
 add('appearance','Език, светъл и тъмен режим','Language, light and dark mode','Бутоните горе сменят BG/EN и светъл/тъмен режим. Пробвай ги: настройките в демото са временни и не променят предпочитанията на реалната страница.','The header switches BG/EN and light/dark mode. Try them: demo preferences are temporary and do not change the real page.',record(annual,'overview'));
 add('backups','Архив и възстановяване','Backup and restore','JSON архивът пази състезанието, сезона и историята. Тук можеш да изтеглиш примерния архив и да го възстановиш. Реалният запис извън демото остава отделен.','JSON backups include the competition, season and history. Download the sample backup and restore it here. The real record remains separate.',record(annual,'connect'));
 add('practice','Обиколката е завършена — пробвай сам','Tour complete — try it yourself','Можеш да останеш в тази тренировъчна арена, да започнеш ново примерно състезание или да се върнеш към отделна стъпка. „Изход от демото“ връща реалното състезание.','Stay in the practice arena, start a new sample competition or revisit any step. Exit demo returns to your real competition.',record(annual,'overview'),{last:true});

 window.addEventListener('message',e=>{
  if(!modal||e.source!==frame.contentWindow||!e.data?.smDemo||e.data.token!==token)return;
  if(e.data.kind==='download'&&e.data.blob instanceof Blob&&e.data.blob.size<=30000000&&/^[a-zA-Z0-9_.-]+\.(docx|csv|json)$/.test(e.data.name||'')){clearDownload();playing=false;clearTimeout(timer);paint();downloadURL=URL.createObjectURL(e.data.blob);const a=document.createElement('a');a.href=downloadURL;a.download='DEMO-'+e.data.name;a.textContent=pick('↓ Изтегли демо файла','↓ Download demo file')+' · '+a.download;modal.querySelector('#demoFileSlot').appendChild(a);}
  if(e.data.kind==='ready'){ready=true;clearTimeout(watchdog);paint();schedule();}
  if(e.data.kind==='interact'&&playing){playing=false;clearTimeout(timer);paint();}
  if(e.data.kind==='close')close();
  if(e.data.kind==='viewer'){playing=false;show(steps.findIndex(s=>s.id==='spectators'));}
  if(e.data.kind==='error'){playing=false;clearTimers();modal.querySelector('#demoStatus').textContent=pick('Неуспешно зареждане на примера. Избери друга стъпка.','Sample could not load. Select another step.');}
 });
 document.addEventListener('click',e=>{if(!e.target.closest('[data-act="demoLaunch"]'))return;e.preventDefault();e.stopImmediatePropagation();launch(e.target.closest('[data-act="demoLaunch"]'));},true);
})();
</script></body></html>
