пълно оттегляне. Предишните резултати се запазват. Дисквалификация от цялото състезание изисква отделно решение на организатора.',tiebody:'Крайното равенство по подразбиране остава споделено. Може предварително да се избере сравняване на броя първи, после втори места и т.н., или мястото в последната планирана дисциплина. Ако и то е равно, мястото остава споделено. За допълнителен двубой впишете решението в подписания протокол; не добавяйте дисциплина с точки само за равните атлети, защото това променя общото точкуване.',bgbody:'България: източниците потвърждават теглене на превозни средства, ярем, дънер, фермерска разходка, камъни и комбинирани трасета. Русенският университет през 2025 г. публикува гума 20 m за време, пудовка за дистанция, фермерска разходка 40 m и автомобил 20 m за време. Това са параметри на конкретен турнир, не универсални стандарти. Не е открит достъпен подробен национален правилник за всички дисциплини; конкретните правила трябва да се потвърдят от организатора.',safetybody:'Приложението изчислява приетите от съдиите резултати. Не определя техническата валидност на движение. Преди старта запишете командите, финишната точка, лимита, точността, реда на снарядите, позволените средства и последствията при нарушение. За специални формати (stone-off, дуели, турнирни схеми, специфичен Wessels tie-break) използвайте потвърдени съдийски места; приложението не управлява отделен елиминационен турнир.',syncTitle:'Един терен. Общи резултати.',syncSub:'Самостоятелният HTML работи офлайн. Споделената сесия изисква работещ сървър.',server:'Адрес на сървъра',key:'Код за достъп',actor:'Име на съдията на това устройство',join:'Присъедини се към сесия',publish:'Създай обща сесия от това състезание',disconnect:'Продължи самостоятелно',syncHelp:'За Cloudflare свържете D1 база SM_DB и секрет SM_KEY според DEPLOY-BG.md. Използвайте адреса на този сайт с /strongman накрая. Първият съдия създава сесията, останалите се присъединяват. За локален Wi-Fi без интернет е включ function modeRule(e){const bg={race:'Завършилите са пред всички незавършили и се подреждат по по-кратко време. Незавършилите — по повече изминати метри. Равно разстояние е равен резултат, освен ако предварително е избрано време до измервателната точка.',reps:'Броят се само повторенията, признати от съдията. При равен брой точките се делят, освен ако предварително е включено време до последното зачетено повторение.',max:'Сравнява се най-тежкият успешен опит. Еднаквите тежести са равни; телесно тегло и брой опити не се използват автоматично. Запишете опитите в бележката.',hold:'По-дългото валидно задържане печели. Времето се спира при съдийския критерий за загуба на позиция или хват.',distance:'По-голямата валидна дистанция печели. При Конаново колело използвайте общо изминати метри, а не смесени обиколки и градуси.',series:'Повече завършени снаряди или стъпки печелят. При включено време се сравнява времето до последния зачетен успех; при „само пълна серия“ частичните равни бройки делят точки.',medley:'Първо повече завършени етапи, после повече метри в следващия етап, после времето според избраната настройка. Не събирайте несъпоставими метри от различни етапи. Необходима е ясна последователност.',height:'По-голяма успешно преодоляна височина печели. Само ако е включено: по-малко неуспехи на най-добрата височина, после по-малко общо. Иначе равното постижение дели точки.',tiers:'Повече повторения с най-тежкия уред печелят, после със средния, после с най-лекия. Едно тежко повторение побеждава произволен брой по-леки. Тежестите и редът трябва да са еднакви за всички.',manual:t('manualhint')},en={race:'Finishers rank ahead of every non-finisher and are ordered by faster time. Non-finishers rank by greater distance. Equal distance ties unless time to a measured checkpoint was agreed in advance.',reps:'Count only referee-approved repetitions. Equal counts share points unless time to the last valid rep was enabled before the start.',max:'Rank the heaviest successful attempt. Equal weights tie. Bodyweight and attempt count are not automatic tiebreakers. Record attempts in the note.',hold:'The longest valid hold wins. Timing ends at the referee’s defined position or grip failure.',distance:'The greatest valid distance wins. For Conan’s wheel use total metres, not a mixture of laps and degrees.',series:'More completed implements or steps wins. If timing is enabled use the split at the last valid success. With finishers-only timing, equal partial counts share points.',medley:'Compare completed stages first, then metres into the next stage, then time under the selected policy. Do not add incomparable metres from different stages. Define a clear stage order.',height:'Greater successful height wins. Only when enabled: fewer misses at the best height, then fewer total misses. Otherwise equal heights share points.',tiers:'Compare heavy reps first, then medium reps, then light reps. One heavier rep beats any number of lighter reps. Loads and order must be the same for everyone.',manual:t('manualhint')};return (lang==='bg'?bg:en)[e.mode];}
function resultFields(e,r={}){const active=['ok','dnf'].includes(r.status||'ok');if(!active)return '';const inp=(k,label,major=false)=>`<div class="${major?'major':''}">${field(k,t(label),r[k]??'','text',`inputmode="decimal" autocomplete="off"`)}</div>`;let html='';switch(e.mode){case'race':html=r.status==='dnf'?inp('distance','distancefield',true)+(e.secondary==='all'?inp('time','time'):''):inp('time','time',true);break;case'reps':html=inp('reps','repsfield',true)+(e.secondary==='all'?inp('time','time'):'');break;case'max':html=inp('weight','weight',true);break;case'hold':html=inp('time','holdfield',true);break;case'distance':html=inp('distance','distancefield',true);break;case'series':case'medley':html=inp('count','countfield',true)+(e.mode==='medley'?inp('partial','partial'):'')+(e.secondary!=='none'?inp('time','time'):'');break;case'height':html=inp('height','heightfield',true)+(e.secondary==='all'?`<div class="grid">${inp('misses','misses')}${inp('totalMisses','totalMisses')}</div>`:'');break;case'tiers':html=inp('heavy','heavy')+inp('medium','medium')+inp('light','light');break;case'manual':html=inp('placing','placing',true);break;}return html;}

function performance(e,r){if(!r)return '—';if(['zero','dns','wd','dq'].includes(r.status))return t(r.status==='zero'?'zeroStatus':r.status);let s='';switch(e.mode){case'race':s=r.status==='dnf'?`${fmt(r.distance)} m · DNF`:`${fmt(r.time)} s`;break;case'reps':s=`${r.reps} ${lang==='bg'?'повт.':'reps'}`;break;case'max':s=`${fmt(r.weight)} kg`;break;case'hold':s=`${fmt(r.time)} s`;break;case'distance':s=`${fmt(r.distance)} m`;break;case'series':case'medley':s=`${r.count}/${e.target}`+(e.mode==='medley'&&r.partial?` + ${fmt(r.partial)} m`:'');break;case'height':s=`${fmt(r.height)} m`+(e.secondary==='all'?` (${r.misses}/${r.totalMisses})`:'');break;case'tiers':s=`${r.heavy} / ${r.medium} / ${r.light}`;break;case'manual':s=`#${r.placing}`;}

async function request(url,key,path,options={}){const res=await fetch(url+path,{...options,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json',...(options.headers||{})},signal:AbortSignal.timeout(8000)});if(res.status===304)return null;const body=await res.json();if(!res.ok)throw Object.assign(Error(body.error||'NETWORK'),{status:res.status});return body;}
async function connect(create){if(sync&&queue.length){toast(t('onlineleave'));return;}const f=$('#syncForm');if(!f.reportValidity())return;const fd=new FormData(f),url=String(fd.get('server')).replace(/\/$/,''),key=String(fd.get('key')),name=String(fd.get('actor')).trim();try{let remote=await request(url,key,'/api/state');if(create){if(remote.doc){toast(t('serverexists'));return;}remote=await request(url,key,'/api/init',{method:'POST',body:JSON.stringify({doc})});}else{if(!remote.doc){toast(t('serverempty'));return;}if(!confirm(t('confirmjoin')))return;backup();}SM.validate(remote.doc.data);doc=remote.doc;sync={url,key,actor:name};localStorage.setItem('sm-actor',name);queue=[];net='online';lastServer=SM.clone(doc);persist();render();toast(t('synced'));}catch{toast(t('syncerror'));}}
async function pump(){if(!sync||busy||net==='conflict')return;busy=true;const conf=SM.clone(sync);try{while(queue.length){const op=queue[0],remote=await request(conf.url,conf.key,'/api/op',{method:'POST',body:JSON.stringify(op)});queue.shift();lastServer=remote.doc;let merged=SM.clone(remote.doc);for(const waiting of queue)merged=SM.apply(merged,waiting);doc=merged;persist();}const remote=await request(conf.url,conf.key,'/api/state',{headers:doc.revision===lastServer?.revision?{'If-None-Match':'"'+doc.revision+'"'}:{}});if(remote?.doc&&JSON.stringify(remote.doc)!==JSON.stringify(doc)){if(remote.doc.data.id!==doc.data.id&&queue.length)throw Error('CONFLICT');lastServer=remote.doc;let rebased=SM.clone(remote.doc);for(const waiting of queue)rebased=SM.apply(rebased,waiting);doc=rebased;persist();if(!$('#dialog').open&&!document.activeElement?.matches('input,textarea,select'))render();else refreshLiveTables();}net='online';}catch(err){net=err.message==='CONFLICT'||err.status===409?'conflict':'offline';}finally{busy=false;$('#savebadge').innerHTML=badge();if(view==='connect'&&!document.activeElement?.matches('input'))render();}}

document.addEventListener('input',ev=>{if(ev.target.id==='search')filterCatalog();if(ev.target.closest('#eventForm')){drafts.event={id:$('#eventForm').dataset.id,values:Object.fromEntries(new FormData($('#eventForm')))};persist();}if(ev.target.closest('#resultForm'))captureDraft();if(ev.target.closest('#setupForm')||ev.target.closest('#rulesForm'))captureSetupDraft();});
document.addEventListener('change',ev=>{if(ev.target.closest('#eventForm')){drafts.event={id:$('#eventForm').dataset.id,values:Object.fromEntries(new FormData($('#eventForm')))};persist();}if(ev.target.id==='standingsThrough'){standingsThrough=Number(ev.target.value);persist();render();}if(ev.target.id==='group')filterCatalog();if(ev.target.id==='athlete'){captureDraft();athleteId=ev.target.value;persist();render();}if(ev.target.id==='status'){captureDraft();render();}if(ev.target.id==='mode'&&ev.target.closest('#eventForm')){const mode=ev.target.value;$('#target').previousElementSibling.textContent=t(mode==='race'?'targetdistance':'targetcount');$('#secondary').innerHTML=secondaryOptions(mode).map(([v,s])=>`<option value="${v}">${s}</option>`).join('');}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='resultForm')saveResult();if(ev.target.id==='setupForm')saveSetup();if(ev.target.id==='eventForm'){const f=ev.target;if(!f.reportValidity())return;const fd=Object.fromEntries(new FormData(f)),events=SM.clone(d().events),e=events.find(x=>x.id===f.dataset.id);e.names={bg:fd.bg.trim(),en:fd.en.trim()};e.mode=fd.mode;e.target=SM.number(fd.target);e.cap=SM.number(fd.cap);e.secondary=fd.secondary;e.weights=fd.weights;e.notes=fd.notes;e.reviewed=fd.reviewed==='on';if(!e.names.bg||!e.names.en||!Number.isFinite(e.target)||e.target<0||!Number.isFinite(e.cap)||e.cap<0||['race','series','medley'].includes(e.mode)&&e.target<=0||['series','medley'].includes(e.mode)&&!Number.isInteger(e.target)){toast(t('error'));return;}if(!['race','reps','series','medley','height'].includes(e.mode))e.secondary='none';try{delete drafts.event;commit([{path:['data','events'],next:events}],'Configure event: '+eventName(e));$('#dialog').close();applySetupDraft();}catch{toast(t('error'));}}});
$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>30000000)throw Error();const parsed=JSON.parse(await file.text());if(parsed.app!=='StrongmanArena'||parsed.version!==1)throw Error();SM.validate(parsed.doc.data);if(!Array.isArray(parsed.doc.log)||!Array.isArray(parsed.doc.undo)||!Array.isArray(parsed.doc.redo))throw Error();if(!confirm(t('confirmrestore')))return;backup();if(sync){if(queue.length){toast(t('onlineleave'));return;}changeData(parsed.doc.data,'Restore competition');}else{doc=parsed.doc;queue=[];drafts=parsed.drafts||{};}view=d().phase==='setup'?'setup':'standings';persist();render();}catch{toast(t('invalidbackup'));}ev.target.value='';});
window.addEventListener('storage',ev=>{if(ev.key===STORE){toast(lang==='bg'?'Друга страница е променила данните. Използвайте една страница на устройство.':'Another tab changed data. Use one tab per device.');}});
window.addEventListener('beforeunload',()=>{captureDraft();captureSetupDraft();persist();});
render();applySetupDraft();if(drafts.event&&d().phase==='setup'&&d().events.some(e=>e.id===drafts.event.id)){editEvent(drafts.event.id);for(const [key,value]of Object.entries(drafts.event.values)){const element=$('#eventForm [name="'+key+'"]');if(element){if(element.type==='checkbox')element.checked=value==='on';else element.value=value;}}}setInterval(pump,1200);if(sync)pump();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')&&location.pathname.includes('/strongman/'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
