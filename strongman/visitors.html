function publicURL(){const u=new URL(location.href);u.search='';if(tab==='season')u.searchParams.set('tab','season');if(roundId)u.searchParams.set('round',roundId);if(athleteId)u.searchParams.set('athlete',athleteId);if(tvMode)u.searchParams.set('tv','1');return u.href;}
function render(){document.documentElement.lang=lang;$('#language').textContent=lang==='bg'?'EN':'БГ';status();document.body.classList.toggle('tv-page',Boolean(tvMode&&state));const filtersOpen=$('#visitorFilters')?.open||false;if(!state){$('#controls').innerHTML='';return;}if(roundId&&!state.season?.competitions.some(c=>c.id===roundId))roundId='';const c=comp();if(through>c.events.length)through=-1;if(!c.athletes.some(a=>a.id===athleteId))athleteId='';if(!c.events.some(e=>e.id===selectedEvent))selectedEvent='';
 $('#controls').innerHTML=`<div class="hero"><div><span class="eyebrow">${L('НА ЖИВО · САМО ПРЕГЛЕД','LIVE · READ ONLY')}</span><h1>${esc(tab==='season'?state.season?.title||L('Сезон','Season'):c.title||L('Очакваме състезанието','Waiting for the competition'))}</h1><p class="muted">${tab==='season'?esc(state.season?.year||''):esc(c.date)+' · '+esc(c.venue)}</p></div></div><div class="visitor-tabs noprint"><button data-view="competition" class="${tab==='competition'?'dark':''}">${L('На живо','Live results')}</button>${state.season?`<button data-view="season" class="${tab==='season'?'dark':''}">${L('Сезон','Season')}</button>`:''}<button id="tvMode" aria-label="${L('Режим екран за публика','Venue display mode')}">▣ TV</button><button id="shareView" aria-label="${L('Сподели класирането','Share standings')}"><span class="share-label">${L('Сподели ','Share ')}</span>↗</button><button id="refresh" class="small" aria-label="${L('Обнови резултатите','Refresh results')}">↻</button></div><div id="shareInfo" role="status"></div>${tab==='competition'?`<div class="visitor-toolbar noprint"><div class="field"><label class="sr-only" for="search">${L('Търси състезател','Search athlete')}</label><input id="search" value="${esc(search)}" type="search" placeholder="${L('Търси състезател…','Search athletes…')}"></div>${athleteId?`<button id="allAthletes">← ${L('Всички състезатели','All athletes')}</button>`:''}</div><details class="filter-drawer card noprint" id="visitorFilters"><summary>${L('Филтри и архив','Filters & archive')}${roundId?' · '+esc(c.title):''}${through>0?' · '+L('след ','after ')+through:''}</summary><div class="grid"><div class="field"><label for="round">${L('Състезание / архив','Competition / archive')}</label><select id="round"><option value="">${L('Текущо: ','Current: ')}${esc(state.competition.title)}</option>${(state.season?.competitions||[]).map(r=>`<option value="${esc(r.id)}" ${roundId===r.id?'selected':''}>${esc(r.data.title)} · ${esc(r.data.date)}</option>`).join('')}</select></div><div class="field"><label for="through">${L('Натрупани точки до','Cumulative points through')}</label><select id="through"><option value="-1">${L('Всички въведени резултати','All entered results')}</option>${c.events.map((e,i)=>`<option value="${i+1}" ${through===i+1?'selected':''}>${i+1}. ${esc(e.names[lang])}</option>`).join('')}</select></div></div><button id="print">${L('Печат / PDF','Print / PDF')}</button></details>`:''}`;
 if($('#visitorFilters')){$('#visitorFilters').open=filtersOpen;$('.visitor-toolbar')?.appendChild($('#visitorFilters'));}const opened=[...document.querySelectorAll('details[open][data-detail]')].map(x=>x.dataset.detail);$('#content').innerHTML=tvMode?tvContent():tab==='season'?seasonContent():competitionContent();for(const detail of document.querySelectorAll('details[data-detail]'))if(opened.includes(detail.dataset.detail))detail.open=true;saveVisitorContext();
}
function competitionContent(){const c=comp(),n=through<0?c.events.length:through,events=c.events.slice(0,n),all=SM.standings(c,n),entered=events.reduce((v,e)=>v+c.athletes.filter(a=>c.results[e.id]?.[a.id]).length,0),expected=events.length*c.athletes.length,final=c.phase==='finished'&&n===c.events.length&&entered===expected&&expected>0;const own=all.find(r=>r.athlete.id===athleteId);const fav=id=>pinned.includes(c.id+':'+id);const filtered=all.filter(r=>r.athlete.name.toLocaleLowerCase().includes(search.toLocaleLowerCase()));const ordered=[...filtered.filter(r=>fav(r.athlete.id)),...filtered.filter(r=>!fav(r.athlete.id))];
 let html=`<div class="notice ${final?'good':''}"><strong>${final?L('Окончателно класиране','Final standings'):L('Временно класиране','Provisional standings')}</strong> · ${entered}/${expected} ${L('резултата','results')}${through>=0?' · '+L('След дисциплина ','After event ')+n:''}${!final?'<span class="standings-hint">'+L('Местата и точките се обновяват с новите резултати.','Places and points update as results arrive.')+'</span>':''}</div>`;
 if(!c.athletes.length)return html+`<div class="card vis-empty">${L('Началото предстои. Резултатите ще се появят автоматично.','The competition is being prepared. Results will appear automatically.')}</div>`;
 const activeEvent=events.find(e=>e.id===selectedEvent);html+=events.length?`<div class="event-overview noprint"><div class="event-progress"><button data-overall class="${!activeEvent?'dark':''}">${L('Общо класиране','Overall standings')}<small>${n} ${L('дисциплини','events')}</small></button>${events.map((e,i)=>{const count=c.athletes.filter(a=>c.results[e.id]?.[a.id]).length;return `<button data-event="${esc(e.id)}" class="${selectedEvent===e.id?'dark':''}" aria-pressed="${selectedEvent===e.id}">${i+1}. ${esc(e.names[lang])}<small>${count}/${c.athletes.length} · ${count===c.athletes.length?L('Завършена','Complete'):count?L('Резултати в ход','Results in progress'):L('Предстои','Upcoming')}</small></button>`;}).join('')}</div></div>`:'';
 if(own){html+=`<section class="card athlete-profile-section"><div class="athlete-profile-head"><div><span class="eyebrow">${L('СЪСТЕЗАТЕЛ','ATHLETE')} #${own.athlete.bib}</span><h2>${esc(own.athlete.name)}</h2><p class="caption">${L('Място','Place')}: ${own.tied?'=':''}${own.rank} · <strong>${fmt(own.total)} ${L('точки','points')}</strong></p></div><div class="row noprint"><button id="pinAthlete">${fav(athleteId)?'★':'☆'} ${fav(athleteId)?L('Следван','Following'):L('Следи','Follow')}</button><button data-all-athletes>← ${L('Класиране','Standings')}</button></div></div><div class="tablewrap"><table><thead><tr><th>${L('Дисциплина','Event')}</th><th>${L('Резултат','Result')}</th><th>${L('Място','Place')}</th><th>${L('Точки','Points')}</th></tr></thead><tbody>${events.map(e=>{const r=SM.eventScores(c,e).find(r=>r.athlete.id===athleteId);return `<tr><td class="name">${esc(e.names[lang])}</td><td>${esc(perf(e,r.result))}</td><td>${r.rank?(r.tied?'=':'')+r.rank:'—'}</td><td>${r.points===null?'—':fmt(r.points)}</td></tr>`;}).join('')}</tbody></table></div></section>`;}
 else if(activeEvent)html+=`<section class="card"><h2>${esc(activeEvent.names[lang])}</h2>${resultTable(c,activeEvent)}</section>`;
 else html+=(all.some(r=>r.total>0)&&!search?`<div class="spectator-podium">${all.filter(r=>r.total>0).slice(0,3).map(r=>`<button class="podium-tile" data-athlete="${esc(r.athlete.id)}"><span class="eyebrow">${L('Място','Place')} ${r.tied?'=':''}${r.rank}</span><strong>${esc(r.athlete.name)}</strong><span class="podium-total">${fmt(r.total)} <small>${L('т.','pts')}</small></span></button>`).join('')}</div>`:'')+`<section class="card leaderboard-card"><div class="row between"><h2>${L('Общо класиране','Overall standings')}</h2><span class="caption">${c.athletes.length} ${L('участници','athletes')}</span></div><div class="leaderboard-list">${ordered.map(r=>`<button class="leaderboard-person ${fav(r.athlete.id)?'pinned':''}" data-athlete="${esc(r.athlete.id)}"><span class="rank ${r.rank===1?'top':''}">${r.tied?'=':''}${r.rank}</span><span><span class="who">${fav(r.athlete.id)?'★ ':''}${esc(r.athlete.name)}</span><span class="caption">#${r.athlete.bib} · ${r.events.filter(e=>e.result).length}/${events.length} ${L('дисциплини','events')} · ${L('Резултати →','Results →')}</span></span><span class="points">${fmt(r.total)} <small>${L('т.','pts')}</small></span></button>`).join('')||`<p class="empty">${L('Няма съвпадения.','No matches.')}</p>`}</div></section>`;
 return html;
}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;if(b.id==='allAthletes'||b.hasAttribute('data-all-athletes')){athleteId='';search='';render();window.scrollTo(0,0);}if(b.id==='pinAthlete'){const key=comp().id+':'+athleteId;pinned=pinned.includes(key)?pinned.filter(x=>x!==key):[...pinned,key];render();}if(b.hasAttribute('data-overall')){selectedEvent='';render();}if(b.dataset.event){selectedEvent=b.dataset.event;athleteId='';render();}if(b.id==='tvMode'){tvMode=true;render();window.scrollTo(0,0);}if(b.id==='exitTv'){tvMode=false;render();}if(b.id==='tvPause'){tvPaused=!tvPaused;render();}if(b.id==='tvNext'){tvPage++;render();}if(b.id==='shareView'){const url=publicURL();try{if(navigator.share)await navigator.share({title:'Strongman Arena',url});else await navigator.clipboard.writeText(url);$('#shareInfo').innerHTML='<div class="notice good">'+L('Линкът е споделен / копиран.','Link shared / copied.')+'</div>';}catch(err){if(err.name!=='AbortError')$('#shareInfo').innerHTML='<div class="field"><label for="shareLink">'+L('Копирайте линка','Copy this link')+'</label><input id="shareLink" readonly value="'+esc(url)+'"></div>';}}});

function tvContent(){const c=comp(),n=through<0?c.events.length:through,rows=SM.standings(c,n),pages=Math.max(1,Math.ceil(rows.length/6));tvPage=tvPage%pages;const final=c.phase==='finished'&&n===c.events.length&&n>0&&c.events.every(e=>c.athletes.every(a=>c.results[e.id]?.[a.id]));const heading=tab==='season'?(state.season?.title||L('Сезон','Season')):c.title;const body=tab==='season'?seasonContent():`<div class="notice"><strong>${final?L('Окончателно класиране','Final standings'):L('Временно класиране','Provisional standings')}</strong> · ${c.events.slice(0,n).filter(e=>c.athletes.every(a=>c.results[e.id]?.[a.id])).length}/${n} ${L('завършени дисциплини','completed events')}</div><div class="leaderboard-list">${rows.slice(tvPage*6,tvPage*6+6).map(r=>`<div class="leaderboard-person"><span class="rank ${r.rank===1?'top':''}">${r.tied?'=':''}${r.rank}</span><span><span class="who">${esc(r.athlete.name)}</span><span class="caption">#${r.athlete.bib} · ${r.events.filter(e=>e.result).length}/${n} ${L('дисциплини','events')}</span></span><span class="points">${fmt(r.total)} <small>${L('т.','pts')}</small></span></div>`).join('')}</div>`;return `<div class="tv-heading"><div><span class="eyebrow">STRONGMAN ARENA · ${tab==='season'?L('СЕЗОН','SEASON'):L('КЛАСИРАНЕ','STANDINGS')}</span><h1>${esc(heading||'Strongman')}</h1><p id="tvStatus" class="caption" role="status">${tvStatusText()}</p></div><div class="tv-controls">${pages>1&&tab==='competition'?`<button id="tvPause" aria-pressed="${tvPaused}">${tvPaused?L('Продължи','Resume'):L('Пауза','Pause')}</button><button id="tvNext">${L('Следващи','Next')} →</button>`:''}<button class="tv-exit" id="exitTv">${L('Изход · Esc','Exit · Esc')}</button></div></div>${pages>1&&tab==='competition'?`<p class="tv-pagenum">${L('Страница','Page')} ${tvPage+1}/${pages} · ${tvPaused?L('На пауза','Paused'):L('Автоматично прелистване на 12 s','Auto-advance every 12 s')}</p>`:''}`+body;}
function tvStatusText(){return (online?L('На живо','Live'):L('Без връзка · последни получени данни','Offline · last received data'))+(lastSeen?' · '+lastSeen.toLocaleTimeString(lang==='bg'?'bg-BG':'en-GB'):'');}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&tvMode){tvMode=false;render();}});

setInterval(()=>{if(tvMode&&state&&!tvPaused&&tab==='competition'&&comp().athletes.length>6){tvPage++;render();}},12000);

'use strict';
let lang;try{lang=localStorage.getItem('sm-visitor-lang')||'bg';}catch{lang='bg';}if(!['bg','en'].includes(lang))lang='bg';
const L=(bg,en)=>lang==='bg'?bg:en,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString(lang==='bg'?'bg-BG':'en-GB',{maximumFractionDigits:2}),$=s=>document.querySelector(s);
let state=null,etag='',busy=false,online=false,lastSeen=null,tab=new URLSearchParams(location.search).get('tab')==='season'?'season':'competition',roundId='',athleteId='',through=-1,search='';
let dirty=false,viewerAvailability='loading';const api=new URL(location.pathname.includes('/strongman/')?'/strongman/api/viewer':'/api/viewer',location.origin).href;
function comp(){return roundId?state?.season?.competitions.find(c=>c.id===roundId)?.data||state.competition:state?.competition;}
function perf(e,r){if(!r)return '—';if(['zero','dns','wd','dq'].includes(r.status))return r.status==='zero'?L('Нулев резултат','No valid result'):r.status.toUpperCase();let s='';switch(e.mode){case'race':s=r.status==='dnf'?fmt(r.distance)+' m · DNF':fmt(r.time)+' s';break;case'reps':s=r.reps+' '+L('повт.','reps');break;case'max':s=fmt(r.weight)+' kg';break;case'hold':s=fmt(r.time)+' s';break;case'distance':s=fmt(r.distance)+' m';break;case'series':case'medley':s=r.count+'/'+e.target+(r.partial?' + '+fmt(r.partial)+' m':'');break;case'height':s=fmt(r.height)+' m'+(e.secondary==='all'?' ('+r.misses+'/'+r.totalMisses+')':'');break;case'tiers':s=r.heavy+' / '+r.medium+' / '+r.light;break;case'manual':s='#'+r.placing;}
 if(['reps','series','medley'].includes(e.mode)&&r.time&&e.secondary!=='none')s+=' · '+fmt(r.time)+' s';if(r.penalty)s+=' +'+fmt(r.penalty)+' s';if(r.deduction)s+=' −'+fmt(r.deduction)+' '+L('т.','pts');return s;}
function status(){ if($('#tvStatus'))$('#tvStatus').textContent=tvStatusText();$('#liveState').textContent=viewerAvailability==='disabled'?L('Очаква публикуване','Awaiting publication'):viewerAvailability==='loading'?L('Свързване…','Connecting…'):online?L('На живо','Live'):L('Без връзка','Offline');$('#liveState').className='badge '+(online?'green':'orange');$('#updated').textContent=lastSeen?(online?L('На живо · ','Live · '):L('Без връзка · ','Offline · '))+L('Последна връзка: ','Last connection: ')+lastSeen.toLocaleTimeString(lang==='bg'?'bg-BG':'en-GB'):'';}
function resultTable(c,e){return `<div class="tablewrap"><table><thead><tr><th>${L('Място','Place')}</th><th>${L('Състезател','Athlete')}</th><th>${L('Резултат','Result')}</th><th>${L('Точки','Points')}</th></tr></thead><tbody>${SM.eventScores(c,e).filter(r=>(!athleteId||r.athlete.id===athleteId)&&r.athlete.name.toLocaleLowerCase().includes(search.toLocaleLowerCase())).map(r=>`<tr><td>${r.rank?(r.tied?'=':'')+r.rank:'—'}</td><td class="name"><button class="textbutton" data-athlete="${esc(r.athlete.id)}">${esc(r.athlete.name)}</button></td><td>${esc(perf(e,r.result))}</td><td class="points">${r.points===null?'—':fmt(r.points)}</td></tr>`).join('')}</tbody></table></div>`;}
function seasonContent(){const s=state.season;if(!s)return '';const rows=SM.seasonScores(s);return `<div class="notice ${s.closed?'good':''}"><strong>${s.closed?L('Финално сезонно класиране','Final season standings'):L('Текущо сезонно класиране','Current season standings')}</strong> · ${s.competitions.length} ${L('завършени кръга','finished rounds')}<br>${L('Всички добавени кръгове се броят. Текущото състезание влиза в сбора след окончателното му добавяне от организатора.','All saved rounds count. The current competition contributes after the organizer saves its final results.')}</div>${s.closed&&rows.length?`<div class="scorebox"><span class="eyebrow">${L('ГОДИШЕН ПОБЕДИТЕЛ','ANNUAL WINNER')}</span><h2 style="margin-top:12px">${esc(rows.filter(r=>r.rank===1).map(r=>r.athlete.name).join(' / '))}</h2><div class="stat">${fmt(rows[0].total)} ${L('т.','pts')}</div></div>`:''}<section class="card"><h2>${esc(s.title)} · ${s.year}</h2><div class="tablewrap"><table><thead><tr><th>${L('Място','Place')}</th><th>${L('Състезател','Athlete')}</th>${s.competitions.map((c,i)=>`<th>${i+1}. ${esc(c.data.title)}</th>`).join('')}<th>${L('Общо','Total')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="rank">${r.tied?'=':''}${r.rank}</td><td class="name">${esc(r.athlete.name)}</td>${r.rounds.map(rr=>`<td>${rr?fmt(rr.points)+(rr.status==='ranked'?' (#'+rr.rank+')':' '+rr.status.toUpperCase()):'—'}</td>`).join('')}<td class="points">${fmt(r.total)}</td></tr>`).join('')}</tbody></table></div><p class="caption" style="margin-top:16px">${L('Скала: ','Scale: ')}${s.scale.join(' / ')} · ${L('След скалата: 0 т. Равни места: средни точки. DNS/DQ: 0 т.','Beyond scale: 0 pts. Tied places: average points. DNS/DQ: 0 pts.')} ${s.tie==='countback'?L('Равен сбор: повече първи, после втори места и т.н.; след това споделено място.','Equal totals: most first places, then seconds, etc.; then shared place.'):L('Равен сбор: споделено място.','Equal totals: shared place.')}</p></section>${s.athletes.filter(a=>rows.some(r=>r.athlete.id===a.id)).map(a=>`<details class="card" data-detail="season-${esc(a.id)}"><summary>${esc(a.name)} · ${fmt(rows.find(r=>r.athlete.id===a.id).total)} ${L('т.','pts')}</summary>${s.competitions.filter(c=>c.entries.some(e=>e.seasonId===a.id)).map(c=>{const entry=c.entries.find(e=>e.seasonId===a.id);return `<div class="row between eventcard"><span>${esc(c.data.title)} · ${esc(c.data.date)}</span><button data-round="${esc(c.id)}" data-profile="${esc(entry.athleteId)}">${L('Резултати','Results')} →</button></div>`;}).join('')}</details>`).join('')}`;}
async function poll(){if(busy)return;busy=true;try{const res=await fetch(api,{headers:etag?{'If-None-Match':etag}:{},cache:'no-store',signal:AbortSignal.timeout(8000)});if(res.status===404){state=null;etag='';online=false;viewerAvailability='disabled';$('#content').innerHTML=`<div class="card empty">${L('Публичният изглед още не е активиран или е изключен от организатора.','Public view has not been enabled, or the organizer has disabled it.')}</div>`;render();return;}if(res.status!==304&&!res.ok)throw Error();online=true;viewerAvailability='online';lastSeen=new Date();if(res.status===304){if(dirty&&!document.activeElement?.matches('input,select')){dirty=false;render();}else status();return;}state=await res.json();etag=res.headers.get('ETag')||'';if(!state.season)tab='competition';if(!document.activeElement?.matches('input,select')){dirty=false;render();}else{dirty=true;status();}}catch{online=false;viewerAvailability='offline';status();if(!state)$('#content').innerHTML=`<div class="notice error">${L('Няма връзка със сървъра. Ще опитаме отново автоматично.','Cannot reach the server. Retrying automatically.')}</div>`;else $('#updated').textContent+=' · '+L('Показани са последните получени данни.','Showing the last received data.');}finally{busy=false;}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.id==='language'){lang=lang==='bg'?'en':'bg';try{localStorage.setItem('sm-visitor-lang',lang);}catch{}render();}if(b.id==='refresh')poll();if(b.id==='print')window.print();if(b.dataset.view){tab=b.dataset.view;render();}if(b.dataset.athlete){athleteId=b.dataset.athlete;search='';render();window.scrollTo(0,0);}if(b.dataset.round){roundId=b.dataset.round;athleteId=b.dataset.profile;tab='competition';through=-1;search='';render();window.scrollTo(0,0);}});
document.addEventListener('change',ev=>{if(ev.target.id==='round'){roundId=ev.target.value;athleteId='';through=-1;search='';render();}if(ev.target.id==='athlete'){athleteId=ev.target.value;render();}if(ev.target.id==='through'){through=Number(ev.target.value);render();}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){search=ev.target.value;$('#content').innerHTML=competitionContent();}});
restoreVisitorContext();status();poll();setInterval(poll,2500);
</script></body></html>
